<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinf boshqaruvi</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#ea580c;--ok:#15803d;--okb:#f0fdf4;--bad:#dc2626;--badb:#fef2f2;--warn:#b45309;--warnb:#fffbeb}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#111827;--ink:#e5e7eb;--muted:#94a3b8;--line:#1f2937;--okb:#052e16;--badb:#450a0a;--warnb:#422006}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  header b{font-size:17px}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  label{font-size:13px;color:var(--muted)}
  select,input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#e2e8f0;color:#0f172a}
  button.pri{background:var(--pri);color:#fff}
  button.ok{background:var(--ok);color:#fff}
  button.bad{background:var(--bad);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  .muted{color:var(--muted);font-size:13px}
  .msg{white-space:pre-line;margin-top:10px;font-size:14px}
  #timer{font:700 40px/1 ui-monospace,Menlo,monospace;letter-spacing:1px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .p-ok{background:var(--okb);color:var(--ok)} .p-bad{background:var(--badb);color:var(--bad)} .p-warn{background:var(--warnb);color:var(--warn)} .p-mut{background:var(--line);color:var(--muted)}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
  .stats div{font-size:13px;color:var(--muted)} .stats b{font-size:20px;color:var(--ink);display:block}
  details summary{cursor:pointer;font-weight:600}
  code{background:var(--line);padding:2px 6px;border-radius:6px;user-select:all;word-break:break-all}
  .hide{display:none!important}
  @media (max-width:640px){#timer{font-size:32px} th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}
</style>
</head>
<body>
<header><b>🏫 Sinf boshqaruvi</b><span class="muted" id="who"></span></header>
<main>
  <div class="card" id="login">
    <p>Boshqaruv sahifasiga faqat ustoz kiradi.</p>
    <button class="pri" id="btnLogin">Google bilan kirish</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hide">
    <div class="card" id="setupCard">
      <details id="setupDet"><summary>⚙️ Sozlash</summary>
        <div style="margin-top:10px" id="secretBox"></div>
        <div class="row" style="margin-top:10px">
          <button id="btnPing">Aloqani tekshirish</button>
          <button id="btnRoster">O'quvchilar ro'yxatini yangilash</button>
        </div>
        <div class="row" style="margin-top:10px">
          <label>Doimiy tugmani yuborish<br><select id="btnGroup"></select></label>
          <button id="btnButtons">Tugmalarni yuborish</button>
        </div>
        <div class="muted" style="margin-top:6px">Doimiy tugma har o'quvchining topic'iga bir marta yuboriladi. Keyin har darsda o'quvchi shu tugmani bosadi va siz ochgan test o'zi ochiladi.</div>
        <div class="msg" id="setupMsg"></div>
      </details>
    </div>

    <div class="card" id="openCard">
      <div class="row">
        <label>Guruh<br><select id="selGroup"></select></label>
        <label>Test<br><select id="selTest"></select></label>
        <label>Daqiqa<br><input id="selMin" type="number" min="5" max="120" value="60" style="width:80px"></label>
        <button class="pri" id="btnOpen">Darsni ochish</button>
      </div>
      <div class="msg" id="openMsg"></div>
    </div>

    <div class="card hide" id="liveCard">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div>
          <div class="muted" id="liveTitle"></div>
          <div id="timer">60:00</div>
          <div class="muted" id="liveState"></div>
        </div>
        <div class="row">
          <button class="ok" id="btnStart">▶ Boshlash</button>
          <button id="btnPause">⏸ Pauza</button>
          <button class="bad" id="btnStop">⏹ To'xtatish</button>
          <button class="pri" id="btnGrade">📤 Natijalarni yuborish</button>
          <button id="btnClose">Darsni yopish</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="msg" id="liveMsg"></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>#</th><th>O'quvchi</th><th>Holat</th><th>Javob</th><th>Chiqish</th><th>Natija</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </div>
</main>
<script src="../fb/firebase-app-compat.js"></script>
<script src="../fb/firebase-auth-compat.js"></script>
<script src="../fb/firebase-database-compat.js"></script>
<script src="../fb/config.js"></script>
<script src="../fb/cls.js"></script>
<script src="tests.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const db = CLS.db, auth = firebase.auth();
  const DEFAULT_API = "https://script.google.com/macros/s/AKfycbyG1ztRvvg2zdwdel1FhDjUytbhkZ0BGjITPkUAo_DNSddF23lbtlVMvbvex6CsG1ZGDw/exec";
  const STUDENT_URL = "https://dilshodustoz.github.io/hometask/class/";
  let admin = {}, roster = {}, group = null, sid = null, sess = null, live = {}, offS = null, offL = null;

  // ---------- kirish ----------
  $("btnLogin").onclick = () => {
    const p = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch(e => { $("loginMsg").textContent = "Kirib bo'lmadi: " + e.message; });
  };
  auth.onAuthStateChanged(u => {
    if (!u) { $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
    $("who").textContent = u.email;
    db.ref("admin").get().then(s => {
      admin = s.val() || {};
      $("login").classList.add("hide"); $("app").classList.remove("hide");
      start();
    }).catch(() => {
      $("loginMsg").textContent = "Bu akkauntga ruxsat yo'q (" + u.email + ").";
      auth.signOut();
    });
  });

  // ---------- Apps Script ----------
  function api(body) {
    return fetch(admin.api || DEFAULT_API, { method: "POST", body: JSON.stringify(Object.assign({ secret: admin.secret }, body)),
      headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow" }).then(r => r.json());
  }
  function randKey(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"[b % 56]).join(""); }
  function drawSecret() {
    $("secretBox").innerHTML = admin.verified
      ? "✅ Apps Script bilan aloqa sozlangan."
      : `<b>Bir martalik sozlash.</b> Apps Script "Hometask Reading" → Project Settings → Script Properties → Add script property: nomi <code>CLASS_SECRET</code>, qiymati <code>${CLS.esc(admin.secret)}</code>. Keyin "Aloqani tekshirish" ni bosing.`;
    $("setupDet").open = !admin.verified;
  }

  function start() {
    if (!admin.secret) { admin.secret = randKey(28); db.ref("admin/secret").set(admin.secret); }
    drawSecret();
    for (const g in CLS.GROUPS) { $("selGroup").add(new Option(CLS.GROUPS[g].name, g)); $("btnGroup").add(new Option(CLS.GROUPS[g].name, g)); }
    window.CLASS_TESTS.forEach(t => $("selTest").add(new Option(t.title, t.key)));
    try { const g = localStorage.getItem("cls_group"); if (g) $("selGroup").value = g; } catch (e) {}
    db.ref("roster").on("value", s => { roster = s.val() || {}; drawTable(); });
    $("selGroup").onchange = () => { try { localStorage.setItem("cls_group", $("selGroup").value); } catch (e) {} watchGroup(); };
    watchGroup();
  }

  $("btnPing").onclick = () => {
    $("setupMsg").textContent = "Tekshirilmoqda…";
    api({ admin: "ping" }).then(r => {
      if (r.ok) { admin.verified = true; db.ref("admin/verified").set(true); drawSecret(); }
      $("setupMsg").textContent = r.ok ? "✅ Aloqa bor" + (r.bot ? "" : ", lekin bot tokeni yo'q!") : "⚠️ " + r.error;
    }).catch(e => { $("setupMsg").textContent = "⚠️ " + e.message; });
  };
  $("btnRoster").onclick = () => {
    $("setupMsg").textContent = "Ro'yxat olinmoqda…";
    api({ admin: "roster" }).then(r => {
      if (!r.ok) { $("setupMsg").textContent = "⚠️ " + r.error; return; }
      const out = {}; let n = 0;
      Object.keys(r.roster).forEach(k => {
        const st = r.roster[k], g = st.test ? "test" : CLS.groupOfChat(st.chat);
        if (g && /^[A-Za-z0-9_-]{6,20}$/.test(k)) { out[k] = { name: st.name, group: g }; n++; }
      });
      return db.ref("roster").set(out).then(() => { $("setupMsg").textContent = `✅ ${n} ta o'quvchi yangilandi.`; });
    }).catch(e => { $("setupMsg").textContent = "⚠️ " + e.message; });
  };
  $("btnButtons").onclick = () => {
    const g = $("btnGroup").value;
    if (!confirm(`${CLS.GROUPS[g].name}: har bir o'quvchining topic'iga doimiy "Sinf testini ochish" tugmasi yuborilsinmi?`)) return;
    $("setupMsg").textContent = "Yuborilmoqda… (har xabar orasida 3 soniya)";
    api({ admin: "class_buttons", chat: CLS.GROUPS[g].chat, url: STUDENT_URL }).then(r => {
      $("setupMsg").textContent = r.ok ? `✅ Yuborildi: ${r.sent}` + (r.fail.length ? `\nXato: ${r.fail.join("; ")}` : "") : "⚠️ " + r.error;
    }).catch(e => { $("setupMsg").textContent = "⚠️ " + e.message; });
  };

  // ---------- dars ----------
  function watchGroup() {
    group = $("selGroup").value;
    if (offS) offS(); if (offL) offL();
    db.ref("current/" + group).once("value").then(c => {
      const cur = c.val();
      if (cur && cur.sid) return db.ref("sessions/" + cur.sid).get().then(s => {
        const v = s.val();
        if (v && v.state !== "closed") attach(cur.sid); else detach();
      });
      detach();
    });
  }
  function detach() { sid = null; sess = null; $("liveCard").classList.add("hide"); $("openCard").classList.remove("hide"); }
  function attach(id) {
    sid = id;
    $("openCard").classList.add("hide"); $("liveCard").classList.remove("hide");
    const sr = db.ref("sessions/" + sid), lr = db.ref("live/" + sid);
    const f1 = sr.on("value", s => { sess = s.val(); if (!sess) { detach(); return; } drawLive(); });
    const f2 = lr.on("value", s => { live = s.val() || {}; drawTable(); });
    offS = () => sr.off("value", f1); offL = () => lr.off("value", f2);
  }
  $("btnOpen").onclick = () => {
    const t = window.CLASS_TESTS.find(x => x.key === $("selTest").value), min = Math.max(5, Math.min(120, parseInt($("selMin").value, 10) || 60));
    const n = Object.values(roster).filter(r => r.group === group).length;
    if (!n) { $("openMsg").textContent = "⚠️ Bu guruhda o'quvchi yo'q. Avval Sozlash → ro'yxatni yangilang."; return; }
    const d = new Date(CLS.now());
    const id = `${t.key}_${group}_${d.toISOString().slice(0, 10).replace(/-/g, "")}_${randKey(5)}`;
    const s = { skill: t.skill, test: t.key, title: t.title, group: group, minutes: min, state: "wait", created: CLS.TS };
    db.ref("sessions/" + id).set(s).then(() => db.ref("current/" + group).set({ sid: id, skill: t.skill, test: t.key }))
      .then(() => attach(id)).catch(e => { $("openMsg").textContent = "⚠️ " + e.message; });
  };
  function upd(o) { return db.ref("sessions/" + sid).update(o).catch(e => alert(e.message)); }
  $("btnStart").onclick = () => {
    const now = CLS.now();
    upd({ state: "run", start: now, end: now + sess.minutes * 60000, pausedTotal: 0 });
  };
  $("btnPause").onclick = () => {
    if (sess.state === "run") upd({ state: "paused", pausedAt: CLS.now() });
    else if (sess.state === "paused") { const p = CLS.now() - sess.pausedAt; upd({ state: "run", end: sess.end + p, pausedTotal: (sess.pausedTotal || 0) + p, pausedAt: null }); }
  };
  $("btnStop").onclick = () => { if (confirm("Testni hamma uchun yakunlaysizmi? Kiritilgan javoblar avtomatik topshiriladi.")) upd({ state: "stopped", stoppedAt: CLS.now() }); };
  $("btnClose").onclick = () => {
    if (!confirm("Darsni yopasizmi? O'quvchilar endi kira olmaydi." + (sess.graded ? "" : "\n⚠️ Natijalar hali yuborilmagan!"))) return;
    upd({ state: "closed" }).then(() => db.ref("current/" + group).remove()).then(detach);
  };
  $("btnGrade").onclick = () => {
    const keys = Object.keys(live).filter(k => live[k] && live[k].joined && roster[k] && !(live[k].result));
    if (!keys.length) { $("liveMsg").textContent = "Yuboriladigan yangi natija yo'q."; return; }
    if (!confirm(`${keys.length} ta o'quvchining natijasi tekshirilib, topic'lariga yuborilsinmi? (taxminan ${Math.ceil(keys.length * 3.2 / 60)} daqiqa)`)) return;
    $("btnGrade").disabled = true;
    $("liveMsg").textContent = `⏳ ${keys.length} ta natija tekshirilmoqda va yuborilmoqda… Sahifani yopmang.`;
    const startT = sess.start || CLS.now();
    const entries = keys.map(k => {
      const end = live[k].submitted || sess.stoppedAt || CLS.now();
      return { k: k, answers: live[k].ans || {}, minutes: Math.min(sess.minutes, Math.round((end - startT - (sess.pausedTotal || 0)) / 60000)) };
    });
    api({ admin: "class_grade", t: sess.test, sid: sid, entries: entries }).then(r => {
      if (!r.ok) throw new Error(r.error);
      const up = {}; let tg = 0;
      r.results.forEach(x => { if (x.raw != null) { up[x.k + "/result"] = { raw: x.raw, band: x.band }; if (x.telegram || x.already) tg++; } });
      return db.ref("live/" + sid).update(up).then(() => upd({ graded: CLS.TS })).then(() => {
        $("liveMsg").textContent = `✅ ${tg} ta natija topic'larga yuborildi.` + (tg < r.results.length ? `\n⚠️ ${r.results.length - tg} tasi yuborilmadi, qayta bosing.` : "");
      });
    }).catch(e => { $("liveMsg").textContent = "⚠️ " + e.message + "\nJavoblar saqlangan, qayta bosib ko'ring."; })
      .finally(() => { $("btnGrade").disabled = false; });
  };

  function drawLive() {
    if (!sess) return;
    $("liveTitle").textContent = `${sess.title} · ${CLS.GROUPS[sess.group].name} · ${sess.minutes} daqiqa`;
    const lab = { wait: "Kutish: o'quvchilar kirmoqda", run: "Test ketmoqda", paused: "⏸ Pauza", stopped: "To'xtatildi: natijalarni yuboring", closed: "Yopilgan" };
    $("liveState").textContent = lab[sess.state] + (sess.graded ? " · natijalar yuborilgan" : "");
    $("btnStart").classList.toggle("hide", sess.state !== "wait");
    $("btnPause").classList.toggle("hide", !(sess.state === "run" || sess.state === "paused"));
    $("btnPause").textContent = sess.state === "paused" ? "▶ Davom ettirish" : "⏸ Pauza";
    $("btnStop").classList.toggle("hide", !(sess.state === "run" || sess.state === "paused"));
    $("btnGrade").classList.toggle("hide", sess.state !== "stopped");
    drawTable();
  }
  function drawTable() {
    if (!sid || !sess) return;
    const rows = Object.keys(roster).filter(k => roster[k].group === sess.group).sort((a, b) => roster[a].name.localeCompare(roster[b].name));
    let inn = 0, away = 0, subm = 0;
    $("tbody").innerHTML = rows.map((k, i) => {
      const v = live[k] || {}, nA = Object.keys(v.ans || {}).length;
      let st;
      if (v.result) st = `<span class="pill p-ok">✅ ${v.result.raw}/40</span>`;
      else if (v.submitted) { st = `<span class="pill p-ok">topshirdi</span>`; subm++; }
      else if (!v.joined) st = `<span class="pill p-mut">kirmagan</span>`;
      else if (v.online === false || v.away) { st = `<span class="pill p-bad">chiqib ketgan</span>`; away++; }
      else { st = `<span class="pill p-warn">ishlamoqda</span>`; inn++; }
      if (v.result) subm++;
      return `<tr><td>${i + 1}</td><td>${CLS.esc(roster[k].name)}</td><td>${st}</td><td>${nA}/40</td><td>${v.leaves || 0}</td><td>${v.result ? "Band " + v.result.band : ""}</td>
        <td>${v.joined && !v.result ? `<button data-k="${k}" class="rst" title="Qayta kirishga ruxsat" style="padding:4px 8px">↺</button>` : ""}</td></tr>`;
    }).join("");
    $("stats").innerHTML = `<div><b>${rows.length}</b>ro'yxatda</div><div><b>${inn}</b>ishlamoqda</div><div><b>${away}</b>chiqib ketgan</div><div><b>${subm}</b>topshirdi</div>`;
    document.querySelectorAll(".rst").forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (confirm(`${roster[k].name}: javoblari o'chirilib, testni boshidan ishlashiga ruxsat berilsinmi?`)) db.ref("live/" + sid + "/" + k).remove();
    });
  }
  setInterval(() => {
    if (!sess) return;
    let left = sess.minutes * 60;
    if (sess.end) left = ((sess.state === "paused" ? sess.pausedAt : sess.state === "stopped" ? sess.stoppedAt : CLS.now()) - sess.end) / -1000;
    $("timer").textContent = CLS.mmss(left);
    if (sess.state === "run" && left <= 0 && !sess.stoppedAt) upd({ state: "stopped", stoppedAt: sess.end });
  }, 500);
})();
</script>
</body>
</html>
