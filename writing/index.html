<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing uy vazifasi · Dilshod ustoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F6F4;--card:#FFF;--ink:#16181D;--muted:#6B6F76;--line:#E4E4E0;--primary:#E8590C;--ok:#15803D;--bad:#B91C1C;--warn:#B45309}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .who{font-weight:700}
  header .ttl{color:var(--muted);font-size:.85rem}
  header .sp{flex:1}
  .pill{font:600 .95rem 'JetBrains Mono',monospace;background:#F1F1EE;border-radius:9px;padding:6px 12px;white-space:nowrap}
  .pill.low{background:#FEF3C7;color:var(--warn)}
  .pill.end{background:#FEE2E2;color:var(--bad)}
  .btn{border:0;border-radius:10px;padding:9px 18px;font:600 .95rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--primary);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:#ECECE8;color:var(--ink)}
  main{flex:1;display:grid;grid-template-columns:minmax(260px,40%) 1fr;gap:0;min-height:0}
  .blur{filter:blur(7px);user-select:none;pointer-events:none}
  .prompt{padding:22px 24px;overflow:auto;border-right:1px solid var(--line);background:var(--card)}
  .prompt .tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);margin-bottom:8px}
  .prompt .q{white-space:pre-wrap;font-size:1rem}
  .prompt .rule{margin-top:16px;color:var(--muted);font-size:.85rem}
  .editor{display:flex;flex-direction:column;padding:16px 18px;min-height:0}
  textarea{flex:1;width:100%;min-height:260px;resize:none;border:1px solid var(--line);border-radius:12px;padding:16px;font:16px/1.7 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff;outline:none}
  textarea:focus{border-color:#C9C9C3}
  textarea[readonly]{background:#FAFAF8}
  .foot{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .foot .msg{flex:1;color:var(--muted);font-size:.85rem}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:.9rem;display:none;z-index:50}
  #cover{position:fixed;inset:0;background:rgba(22,24,29,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  #cover .card{background:#fff;max-width:460px;width:100%;border-radius:16px;padding:24px;text-align:center}
  #cover h3{margin:0 0 8px;font-size:1.2rem}
  #cover .btn{margin-top:16px}
  .ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ptabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font:600 .85rem 'Plus Jakarta Sans',sans-serif;color:var(--muted);cursor:pointer}
  .ptabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ptabs button .n{font-size:.75rem;margin-left:5px;opacity:.8}
  .pimg{margin-top:12px;max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:70;padding:10px;cursor:zoom-out}
  #zoom img{max-width:100%;max-height:100%}
  .hide{display:none!important}
  @media (max-width:760px){
    main{grid-template-columns:1fr;grid-auto-rows:auto}
    .prompt{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
    textarea{min-height:48vh}
    header{padding:8px 12px;gap:8px}
  }
</style>
</head>
<body>
<header>
  <div><div class="who" id="who">Yuklanmoqda…</div><div class="ttl" id="ttl"></div></div>
  <div class="sp"></div>
  <span class="pill" id="wc">0 so'z</span>
  <span class="pill" id="clock">--:--</span>
  <button class="btn" id="btnSubmit" disabled>Topshirish</button>
</header>
<main>
  <section class="prompt">
    <div class="tag" id="task">Writing</div>
    <div class="tag hide" id="ptitle" style="display:block;color:var(--ink);text-transform:none;font-size:.95rem"></div>
    <div class="hide" id="pneed" style="margin:6px 0;padding:8px 10px;border-radius:10px;background:#fff4d6;color:#7a4b00;font-weight:600"></div>
    <div class="q" id="prompt"></div>
    <img class="pimg hide" id="pimg" alt="Grafik">
    <div class="rule" id="rule"></div>
  </section>
  <section class="editor">
    <div class="ptabs hide" id="ptabs"></div>
    <textarea id="ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Essayingizni shu yerga yozing…" readonly></textarea>
    <div class="foot"><div class="msg" id="msg">Matningiz shu qurilmada saqlanib boradi.</div></div>
  </section>
</main>
<div id="cover"><div class="card" id="card"><h3>Yuklanmoqda…</h3><div>Bir soniya kuting.</div></div></div>
<div class="toast" id="toast"></div>
<div id="zoom" class="hide"><img id="zoomImg" alt=""></div>
<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const API = window.HW_API, TID = P.get("t") || "", KEY = P.get("k") || "";
  const ST = "hww_" + TID + "_" + KEY + "_st", PEND = "hww_" + TID + "_" + KEY + "_pend";
  const ed = $("ed");
  let me = null, left = 0, total = 0, run = false, done = false, pastes = 0, leaves = 0, tick = null;
  // Bir vazifada bir nechta topshiriq (masalan, darsdagi 3 ta grafik): T.parts = [{title, prompt, img}]
  let PARTS = null, texts = [], cur = 0, softWarned = false, endAt = 0, warned5 = false, warned1 = false;
  const strict = () => !!(me && !me.soft);
  function allText() {
    if (!PARTS) return ed.value;
    texts[cur] = ed.value;
    return PARTS.map((pt, i) => `${i + 1}) ${pt.title}\n${(texts[i] || "").trim() || "(yozilmagan)"}`).join("\n\n");
  }
  const totalWords = () => PARTS ? texts.reduce((s, t, i) => s + words(i === cur ? ed.value : t), 0) : words(ed.value);
  function drawPart() {
    const pt = PARTS[cur];
    $("ptitle").textContent = `${cur + 1}/${PARTS.length} · ${pt.title}`;
    $("prompt").textContent = pt.prompt || "";
    if (pt.need) { $("pneed").textContent = "✍️ " + pt.need; $("pneed").classList.remove("hide"); } else $("pneed").classList.add("hide");
    ed.placeholder = pt.ph || "Shu topshiriq javobini yozing. Keyingisiga tepadagi tugmalar orqali o'tasiz…";
    if (pt.img) { $("pimg").src = pt.img; $("pimg").classList.remove("hide"); } else $("pimg").classList.add("hide");
    $("ptabs").innerHTML = PARTS.map((x, i) => `<button data-i="${i}" class="${i === cur ? "on" : ""}">${i + 1}. ${esc(x.short || x.title)}<span class="n">${words(i === cur ? ed.value : texts[i])}</span></button>`).join("");
    $("ptabs").querySelectorAll("button").forEach(b => b.onclick = () => { texts[cur] = ed.value; cur = +b.dataset.i; ed.value = texts[cur] || ""; drawPart(); drawWc(); if (run) ed.focus(); });
  }
  $("pimg").onclick = () => { $("zoomImg").src = $("pimg").src; $("zoom").classList.remove("hide"); };
  $("zoom").onclick = () => $("zoom").classList.add("hide");

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function words(s) { return (String(s || "").match(/[A-Za-z0-9À-ɏ'’-]+/g) || []).length; }
  function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function show(title, body, btn, fn, btn2, fn2) {
    $("card").innerHTML = `<h3>${title}</h3><div>${body}</div>` + (btn ? `<button class="btn" id="cBtn">${btn}</button>` : "") + (btn2 ? ` <button class="btn sec" id="cBtn2">${btn2}</button>` : "");
    $("cover").classList.remove("hide");
    if (btn) $("cBtn").onclick = fn || hide;
    if (btn2) $("cBtn2").onclick = fn2 || hide;
  }
  function hide() { $("cover").classList.add("hide"); }
  let toastT = null;
  function toast(t) { $("toast").textContent = t; $("toast").style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => { $("toast").style.display = "none"; }, 2600); }
  function api(q) { return fetch(API + "?" + new URLSearchParams(q), { redirect: "follow" }).then(r => r.json()); }
  function post(b) { return fetch(API, { method: "POST", body: JSON.stringify(b), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow" }).then(r => r.json()); }

  function drawWc() {
    const n = totalWords(), min = me ? me.min_words : 0;
    $("wc").textContent = (PARTS && !done ? words(ed.value) + " · jami " : "") + n + (min ? " / " + min : "") + " so'z";
    if (PARTS && !done) { const b = $("ptabs").querySelector("button.on .n"); if (b) b.textContent = words(ed.value); }
    $("wc").classList.toggle("low", !!min && n < min);
  }
  function drawClock() {
    $("clock").textContent = left < 0 && me && me.soft ? "+" + mmss(-left) : mmss(left);
    $("clock").classList.toggle("low", run && left <= 300 && left > 0);
    $("clock").classList.toggle("end", left <= 0);
  }
  function save() { if (me && run && !done) { if (PARTS) texts[cur] = ed.value; lsSet(ST, { text: PARTS ? texts.join("") : ed.value, texts: PARTS ? texts : null, left: left, endAt: endAt, pastes: pastes, leaves: leaves }); } }
  ed.addEventListener("input", () => { drawWc(); save(); });
  setInterval(save, 3000);
  window.addEventListener("beforeunload", save);

  // nusxa qo'yish va sudrab tashlash yopiq
  ["paste", "drop"].forEach(ev => ed.addEventListener(ev, e => { e.preventDefault(); if (run) { pastes++; save(); toast("📋 Nusxa ko'chirib qo'yish mumkin emas. O'zingiz yozing."); } }));
  ed.addEventListener("beforeinput", e => {
    if (e.inputType === "insertFromPaste" || e.inputType === "insertFromDrop") { e.preventDefault(); return; }
    // telefon klaviaturasidagi "bufer" tavsiyalari paste hodisasisiz katta matn qo'yadi: bir urinishda 40+ belgi = nusxa
    if (run && (e.inputType === "insertText" || e.inputType === "insertReplacementText") && (e.data || "").length > 40) {
      e.preventDefault(); pastes++; save(); toast("📋 Nusxa ko'chirib qo'yish mumkin emas. O'zingiz yozing.");
    }
  });
  ["copy", "cut"].forEach(ev => document.addEventListener(ev, e => { if (strict() && !done) { e.preventDefault(); toast("📋 Bu vazifada nusxa ko'chirish yopiq."); } }));
  ed.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("visibilitychange", () => { if (document.hidden && run && !done) { leaves++; save(); } });

  function start(st) {
    hide();
    if (st) { if (PARTS && st.texts) { texts = st.texts; ed.value = texts[cur] || ""; drawPart(); } else ed.value = st.text || ""; left = typeof st.left === "number" ? st.left : total; pastes = st.pastes || 0; leaves = st.leaves || 0; }
    if (strict()) {
      // qat'iy rejim: vaqt real soat bo'yicha yuradi, sahifa yopilsa ham to'xtamaydi
      endAt = (st && st.endAt) ? st.endAt : Date.now() + left * 1000;
      left = (endAt - Date.now()) / 1000;
      $("prompt").classList.remove("blur"); if ($("pimg").dataset.src) { $("pimg").src = $("pimg").dataset.src; }
    }
    run = true; ed.readOnly = false; ed.focus(); $("btnSubmit").disabled = false;
    drawWc(); drawClock(); save();
    if (strict() && left <= 0) { submit(true); return; }
    let last = Date.now();
    tick = setInterval(() => {
      const now = Date.now(); if (strict()) left = (endAt - now) / 1000; else left -= (now - last) / 1000; last = now;
      drawClock();
      if (strict() && !warned5 && left <= 300 && left > 60) { warned5 = true; toast("⏰ 5 daqiqa qoldi. Vaqt tugaganda essay avtomatik topshiriladi."); }
      if (strict() && !warned1 && left <= 60 && left > 0) { warned1 = true; toast("⏰ 1 daqiqa qoldi!"); }
      if (left <= 0 && me.soft) { if (!softWarned) { softWarned = true; toast("⏰ Tavsiya etilgan vaqt tugadi. Shoshilmang, yozishda davom etavering."); } return; }
      if (left <= 0) { clearInterval(tick); submit(true); }
    }, 500);
  }
  function lock(text, info) {
    run = false; done = true; clearInterval(tick);
    if (PARTS) $("ptabs").classList.add("hide");
    ed.value = text || ""; ed.readOnly = true; $("btnSubmit").disabled = true; $("btnSubmit").textContent = "Topshirildi ✓";
    drawWc(); $("msg").innerHTML = info;
  }
  function send(payload) {
    $("msg").textContent = "⏳ Yuborilmoqda…";
    lsSet(PEND, payload);
    post(payload).then(r => {
      if (!r.ok) throw new Error(r.error || "Yuborilmadi");
      lsDel(ST); lsDel(PEND);
      lock(payload.text, `<b style="color:var(--ok)">✅ Topshirildi: ${r.words} so'z. Matningiz topic'ingizga yuborildi.</b> Feedback ustoz tekshirgandan keyin keladi.`);
      show("✅ Topshirildi", `${esc(me.name)}, essayingiz (${r.words} so'z) ustozga yuborildi.<br>Feedback topic'ingizga keladi.`, "Yaxshi");
    }).catch(e => {
      $("msg").innerHTML = `<b style="color:var(--bad)">⚠️ ${esc(e.message || "Internet xatosi")}.</b> <button class="btn sec" id="retry">Qayta yuborish</button>`;
      $("retry").onclick = () => send(payload);
    });
  }
  function submit(timeUp) {
    if (!run || done) return;
    const n = totalWords(), full = allText(), empty = PARTS ? !texts.some(t => (t || "").trim()) : !ed.value.trim();
    const go = () => {
      run = false; clearInterval(tick); ed.readOnly = true; $("btnSubmit").disabled = true; hide();
      send({ skill: "writing", k: KEY, t: TID, text: full, minutes: Math.ceil((total - (me.soft ? left : Math.max(0, left))) / 60), timeUp: !!timeUp, pastes: pastes, leaves: leaves });
    };
    if (timeUp) {
      if (empty) { run = false; ed.readOnly = true; $("btnSubmit").disabled = true; show("⏰ Vaqt tugadi", "Hech narsa yozilmagan, shuning uchun hech narsa yuborilmadi."); return; }
      go(); return;
    }
    if (empty) { toast("Avval essay yozing."); return; }
    const miss = PARTS ? PARTS.map((x, i) => (texts[i] || "").trim() ? "" : (i + 1) + "-topshiriq").filter(Boolean) : [];
    show("Topshiramizmi?", (miss.length ? `⚠️ ${miss.join(", ")} yozilmagan.<br>` : "") + `${n} so'z yozdingiz` + (n < me.min_words ? ` (talab: kamida ${me.min_words}).` : ".") + "<br>Topshirgandan keyin o'zgartirib bo'lmaydi.", "Ha, topshiraman", go, "Yozishda davom etaman");
  }
  $("btnSubmit").onclick = () => submit(false);

  if (!KEY || !TID || !API) { $("who").textContent = "⛔ Havola noto'g'ri"; show("Havola noto'g'ri", "Telegram'dagi o'zingizning tugmangiz orqali kiring."); return; }
  api({ action: "hello", skill: "writing", k: KEY, t: TID }).then(r => {
    if (!r.ok) { $("who").textContent = "⛔ " + (r.error || "Xato"); show("Kirish mumkin emas", esc(r.error || "Xato")); return; }
    me = r; total = (r.minutes || 40) * 60; left = total;
    $("who").textContent = r.name; $("ttl").textContent = r.title + " · muddat: " + r.deadline;
    $("task").textContent = "Writing " + (r.task || "Task 2") + " · " + r.minutes + " daqiqa";
    $("prompt").textContent = r.prompt;
    if (Array.isArray(r.parts) && r.parts.length) {
      PARTS = r.parts; texts = PARTS.map(() => "");
      $("ptitle").classList.remove("hide"); $("ptabs").classList.remove("hide"); drawPart();
    }
    $("rule").textContent = `Kamida ${r.min_words} so'z yozing. Nusxa ko'chirib qo'yish ishlamaydi. ` + (r.soft ? `Vaqt taxminiy (${r.minutes} daqiqa): tugasa ham sahifa yopilmaydi, yozishda davom etasiz.` : "Vaqt to'xtamaydi (sahifa yopilsa ham). Vaqt tugaganda yozganingiz avtomatik topshiriladi.");
    document.title = r.title + " · Writing";
    drawWc(); drawClock();
    if (r.submitted) {
      lock(r.sub.text, `<b style="color:var(--ok)">✅ Siz bu vazifani topshirgansiz (${r.sub.words} so'z).</b> Feedback ustoz tekshirgandan keyin keladi.`);
      show("Siz bu vazifani topshirgansiz", `${esc(r.name)}, essayingiz (${r.sub.words} so'z) ustozga yuborilgan. Feedback topic'ingizga keladi.`, "Matnimni ko'rish");
      return;
    }
    const pend = lsGet(PEND);
    if (pend) {
      if (PARTS) $("ptabs").classList.add("hide");
      ed.value = pend.text || ""; drawWc();
      show("Yuborilmay qolgan essay bor", "Oldingi safar essayingiz yuborilmay qolgan. Hozir yuboramiz.", "Yuborish", () => { hide(); send(pend); });
      return;
    }
    if (r.closed) { show("Muddat tugagan", "Topshirish muddati (" + esc(r.deadline) + ") o'tib ketgan."); return; }
    const st = lsGet(ST);
    if (st && (st.text || "").trim()) {
      if (PARTS && st.texts) { texts = st.texts; ed.value = texts[cur] || ""; drawPart(); } else ed.value = st.text; drawWc(); left = typeof st.left === "number" ? st.left : total;
      if (strict() && st.endAt) left = (st.endAt - Date.now()) / 1000;
      drawClock();
      if (strict() && left <= 0) { show("⏰ Vaqt tugagan", `Sahifa yopiq turganda ham vaqt yurdi va tugadi. Saqlangan matningiz (${words(st.text)} so'z) hozir topshiriladi.`, "Topshirish", () => start(st)); return; }
      show("Davom ettiramiz", `Matningiz saqlangan (${words(st.text)} so'z). Qolgan vaqt: ${mmss(left)}.` + (strict() ? "<br>⏱ Vaqt sahifa yopiq turganda ham yurgan." : ""), "▶ Davom ettirish", () => start(st));
      return;
    }
    if (strict()) {
      $("prompt").classList.add("blur");
      if (!$("pimg").classList.contains("hide")) { $("pimg").dataset.src = $("pimg").src; $("pimg").removeAttribute("src"); }
      const confirmStart = () => show("Boshlaymizmi?",
        `⏱ <b>${r.minutes} daqiqa</b> hozir boshlanadi va to'xtatib bo'lmaydi.<br>Savol <b>Boshlash</b> bosilgandan keyin ochiladi.<br><br>Tayyormisiz?`,
        "▶ Ha, boshlayman", () => start(null), "Keyinroq", () => showRules());
      const showRules = () => show(`Assalomu alaykum, ${esc(r.name)}!`,
        `${esc(r.title)} · Writing<br><br><b>⚠️ Boshlashdan oldin diqqat bilan o'qing:</b><br>` +
        `⏱ Vaqt: <b>${r.minutes} daqiqa</b>. <b>Boshlash</b> bosilgan zahoti yuradi va <b>to'xtamaydi</b>: sahifani yopsangiz ham vaqt ketaveradi.<br>` +
        `🔒 Vaqt tugaganda yozganingiz <b>avtomatik topshiriladi</b> va sahifa yopiladi.<br>` +
        `👁 Savol faqat <b>Boshlash</b> bosilgandan keyin ko'rinadi.<br>` +
        `📋 Nusxa ko'chirish va qo'yish (copy-paste) <b>ishlamaydi</b>: essayni o'zingiz yozasiz. Urinishlar ustozga ko'rinadi.<br>` +
        `📵 Boshqa ilova yoki sahifaga chiqishlar ham sanaladi.<br>` +
        `📝 Kamida ${r.min_words} so'z.<br>⚠️ Faqat bir marta topshirish mumkin.<br><br>` +
        `Vaqtingiz bo'lmasa, hozir boshlamang: tayyor bo'lganingizda shu tugma orqali qayta kirasiz.`,
        "Tushundim, boshlash", confirmStart);
      showRules();
      return;
    }
    show(`Assalomu alaykum, ${esc(r.name)}!`,
      `${esc(r.title)} · Writing<br><br>` + (PARTS ? `📚 ${PARTS.length} ta topshiriq: tepadagi tugmalar bilan biridan ikkinchisiga o'tasiz.<br>` + (PARTS[0].need ? `✍️ <b>${esc(PARTS[0].need)}</b><br>` : "") : "") + (r.soft ? `⏱ Taxminiy vaqt: ${r.minutes} daqiqa. Shoshilmang: vaqt tugasa ham sahifa yopilmaydi.` : `⏱ Vaqt: ${r.minutes} daqiqa, <b>Boshlash</b> bosilgandan keyin yuradi.`) + `<br>📝 Kamida ${r.min_words} so'z.<br>Oxirida <b>Topshirish</b> ni bosing: essayingiz topic'ingizga ustozga yuboriladi.<br><br>⚠️ Faqat bir marta topshirish mumkin.`,
      "▶ Boshlash", () => start(null));
  }).catch(() => {
    $("who").textContent = "⚠️ Internet xatosi";
    show("Internet xatosi", "Ulanishni tekshirib, sahifani yangilang.", "Yangilash", () => location.reload());
  });
})();
</script>
</body>
</html>
