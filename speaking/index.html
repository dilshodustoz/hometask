<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking uy vazifasi · Dilshod ustoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F6F4;--card:#FFF;--ink:#16181D;--muted:#6B6F76;--line:#E4E4E0;--primary:#E8590C;--ok:#15803D;--bad:#DC2626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
  header .in{display:flex;align-items:center;gap:12px;padding:10px 18px}
  .who{font-weight:700}.ttl{color:var(--muted);font-size:.82rem}.sp{flex:1}
  .prog{font:600 .9rem 'JetBrains Mono',monospace;background:#F1F1EE;border-radius:9px;padding:6px 12px;white-space:nowrap}
  .bar{height:4px;background:#ECECE8}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
  main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  .intro{background:#FFF7ED;border:1px solid #FED7AA;border-radius:14px;padding:12px 16px;font-size:.88rem;color:#7C2D12;margin-bottom:18px}
  .part{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .part h2{margin:0;font-size:1.15rem}.part span{color:var(--muted);font-size:.85rem}
  .topic{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--primary);margin:14px 0 6px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .q .row{display:flex;gap:10px;align-items:flex-start}
  .q .n{flex:none;width:26px;height:26px;border-radius:50%;background:#F1F1EE;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .q.sent .n{background:#DCFCE7;color:var(--ok)}
  .q .t{flex:1;font-weight:600}
  .q .tm{flex:none;font:600 .78rem 'JetBrains Mono',monospace;color:var(--muted);background:#F6F6F4;border-radius:7px;padding:3px 8px}
  .act{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .btn{border:0;border-radius:11px;padding:10px 16px;font:700 .92rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:8px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sec{background:#ECECE8;color:var(--ink)}.btn.stop{background:var(--bad)}.btn.ok{background:var(--ok)}
  .dot{width:10px;height:10px;border-radius:50%;background:#fff}
  .rec{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
  .rec .live{color:var(--bad);font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:6px}
  .rec .live:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px #FEE2E2;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.35}}
  .track{flex:1;height:8px;background:#FEE2E2;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--bad)}
  .clock{font:600 1rem 'JetBrains Mono',monospace;color:var(--bad)}
  audio{flex:1;min-width:200px;height:40px}
  .sent-l{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;font-size:.9rem}
  .sent-l small{color:var(--muted);font-weight:500}
  .cue{background:#FFFBF5;border-color:#F5D0B5}
  .cue ul{margin:8px 0 0 34px;padding:0;color:#3F3F46}.cue li{margin:2px 0}
  .cue .say{margin:8px 0 0 34px;color:var(--muted);font-size:.88rem}
  .prep{display:flex;align-items:center;gap:10px;background:#EFF6FF;color:#1D4ED8;border-radius:11px;padding:8px 12px;font-weight:600;font-size:.88rem;flex:1;white-space:nowrap}
  .prep b{font:600 1rem 'JetBrains Mono',monospace}
  .note{color:var(--muted);font-size:.82rem}
  .done{background:#F0FDF4;border:1px solid #BBF7D0;color:#14532D;border-radius:14px;padding:16px;text-align:center;margin-top:22px;font-weight:600}
  .wait{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:22px;color:var(--muted);font-size:.9rem}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:.9rem;display:none;z-index:50;max-width:92vw;text-align:center}
  #cover{position:fixed;inset:0;background:rgba(22,24,29,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  #cover .card{background:#fff;max-width:460px;width:100%;border-radius:16px;padding:24px;text-align:center}
  #cover h3{margin:0 0 8px;font-size:1.2rem}
  #cover .btn{margin-top:16px}
  .hide{display:none!important}
  @media(max-width:600px){header .in{padding:8px 12px}.ttl{font-size:.75rem}main{padding:12px 12px 50px}.q{padding:12px}.btn{padding:10px 14px}}
</style>
</head>
<body>
<header>
  <div class="in"><div><div class="who" id="who">Yuklanmoqda…</div><div class="ttl" id="ttl"></div></div><div class="sp"></div><span class="prog" id="prog">0 / 0</span></div>
  <div class="bar"><i id="barI"></i></div>
</header>
<main>
  <div class="intro">🎙 Har bir savolni o'qing, <b>Javob berish</b> tugmasini bosing va gapiring. Vaqt tugasa yozish o'zi to'xtaydi. Eshitib ko'ring, keyin <b>Yuborish</b>ni bosing. Yuborilgan javob ustozga Telegram orqali boradi va uni qayta yuborib bo'lmaydi.</div>
  <div id="list"></div>
  <div id="foot"></div>
</main>
<div id="cover"><div class="card" id="card"><h3>Yuklanmoqda…</h3><div>Bir soniya kuting.</div></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="recorder.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const API = window.HW_API, TID = P.get("t") || "", KEY = P.get("k") || "";
  const PART_INFO = { 1: "har biriga", 2: "", 3: "har biriga" };
  let me = null, items = [], done = {}, st = {}, busy = -1;   // st[i] = {s: idle|prep|rec|ready|sending, blob, mime, sec, url}
  let stream = null, ctx = null;

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function mss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function dur(s) { return s >= 60 ? (s % 60 ? Math.floor(s / 60) + " daqiqa " + (s % 60) + " soniya" : (s / 60) + " daqiqa") : s + " soniya"; }
  function show(title, body, btn, fn) {
    $("card").innerHTML = `<h3>${title}</h3><div>${body}</div>` + (btn ? `<button class="btn" id="cBtn">${btn}</button>` : "");
    $("cover").classList.remove("hide");
    if (btn) $("cBtn").onclick = fn || hide;
  }
  function hide() { $("cover").classList.add("hide"); }
  let toastT = null;
  function toast(t) { $("toast").textContent = t; $("toast").style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => { $("toast").style.display = "none"; }, 3200); }
  function api(q) { return fetch(API + "?" + new URLSearchParams(q), { redirect: "follow" }).then(r => r.json()); }
  function post(b) { return fetch(API, { method: "POST", body: JSON.stringify(b), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow" }).then(r => r.json()); }

  // ---------- chizish ----------
  function draw() {
    let h = "", lastPart = 0, lastTopic = null;
    items.forEach((q, i) => {
      if (q.part !== lastPart) {
        const same = items.filter(x => x.part === q.part);
        const info = q.part === 2 ? (q.prep ? dur(q.prep) + " tayyorgarlik · " : "") + dur(q.sec) + " gapirish"
          : same.length + " savol · " + PART_INFO[q.part] + " " + dur(q.sec);
        h += `<div class="part"><h2>Part ${q.part}</h2><span>${info}</span></div>`;
        lastPart = q.part; lastTopic = null;
      }
      if (q.topic && q.topic !== lastTopic) { h += `<div class="topic">${esc(q.topic)}</div>`; lastTopic = q.topic; }
      const cue = q.cue && q.cue.length;
      h += `<div class="q${cue ? " cue" : ""}${done[i] ? " sent" : ""}" id="q${i}"><div class="row"><div class="n">${i + 1}</div><div class="t">${esc(q.q)}</div><div class="tm">${mss(q.sec)}</div></div>` +
        (cue ? `<div class="say">You should say:</div><ul>${q.cue.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "") +
        `<div class="act" id="a${i}"></div></div>`;
    });
    $("list").innerHTML = h;
    items.forEach((q, i) => drawAct(i));
    drawProg();
  }
  function drawProg() {
    const n = Object.keys(done).length, all = items.length;
    $("prog").textContent = n + " / " + all;
    $("barI").style.width = (all ? 100 * n / all : 0) + "%";
    $("foot").innerHTML = all && n >= all ? `<div class="done">✅ Vazifa topshirildi. Hamma ${all} ta javob ustozga yuborildi.</div>`
      : `<div class="wait">Barcha ${all} ta javob yuborilgach shu yerda "✅ Vazifa topshirildi" chiqadi.</div>`;
  }
  function drawAct(i) {
    const el = $("a" + i), q = items[i], s = st[i] || { s: "idle" };
    if (!el) return;
    if (done[i]) { el.innerHTML = `<div class="sent-l">✓ Yuborildi <small>· ${mss(done[i].sec)}</small></div>`; $("q" + i).classList.add("sent"); return; }
    const off = me.closed || (busy >= 0 && busy !== i) ? " disabled" : "";
    if (s.s === "idle") {
      el.innerHTML = q.prep ? `<button class="btn" data-go${off}>▶ Boshlash</button><span class="note">${dur(q.prep)} tayyorlanasiz, keyin yozish o'zi boshlanadi</span>`
        : `<button class="btn" data-go${off}><span class="dot"></span> Javob berish</button>`;
      el.querySelector("[data-go]").onclick = () => begin(i);
    } else if (s.s === "prep") {
      el.innerHTML = `<div class="prep">⏳ Tayyorlanish vaqti: <b id="pc${i}">${mss(s.left)}</b></div><button class="btn sec" data-now>Hoziroq boshlash</button>`;
      el.querySelector("[data-now]").onclick = () => { clearInterval(s.tick); record(i); };
    } else if (s.s === "rec") {
      el.innerHTML = `<div class="rec"><span class="live">Yozilmoqda</span><div class="track"><i id="tr${i}"></i></div><span class="clock" id="rc${i}">0:00</span></div><button class="btn stop" data-stop>■ To'xtatish</button>`;
      el.querySelector("[data-stop]").onclick = () => stop(i);
    } else if (s.s === "wait") {
      el.innerHTML = `<span class="note">⏳ Tayyorlanmoqda…</span>`;
    } else if (s.s === "ready" || s.s === "sending") {
      const sending = s.s === "sending";
      el.innerHTML = (s.url ? `<audio controls preload="metadata" src="${s.url}"></audio>` : `<span class="note">Yozildi: ${mss(s.sec)}</span>`) +
        `<button class="btn sec" data-re${sending || off ? " disabled" : ""}>↺ Qayta</button><button class="btn ok" data-send${sending ? " disabled" : ""}>${sending ? "Yuborilmoqda…" : "➤ Yuborish"}</button>`;
      el.querySelector("[data-re]").onclick = () => { if (s.url) URL.revokeObjectURL(s.url); st[i] = { s: "idle" }; begin(i); };
      el.querySelector("[data-send]").onclick = () => send(i);
    }
  }
  function setBusy(i) { busy = i; items.forEach((q, j) => { if (j !== i) drawAct(j); }); }

  // ---------- mikrofon ----------
  async function mic() {
    if (stream && stream.active) { if (ctx.state !== "running") await ctx.resume(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("nomic");
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
  }
  async function begin(i) {
    if (busy >= 0 && busy !== i) return;
    setBusy(i);
    try { await mic(); }
    catch (e) {
      setBusy(-1); drawAct(i);
      show("Mikrofonga ruxsat kerak", "Brauzer mikrofonga ruxsat so'raganda <b>Ruxsat berish</b> ni bosing.<br><br>Agar ruxsat oynasi chiqmasa: Telegram'da sahifaning yuqorisidagi <b>⋯</b> tugmasini bosib, <b>Brauzerda ochish</b> (Safari/Chrome) ni tanlang.", "Tushunarli");
      return;
    }
    const q = items[i];
    if (q.prep) {
      const s = st[i] = { s: "prep", left: q.prep };
      drawAct(i);
      let last = Date.now();
      s.tick = setInterval(() => {
        const now = Date.now(); s.left -= (now - last) / 1000; last = now;
        const el = $("pc" + i); if (el) el.textContent = mss(s.left);
        if (s.left <= 0) { clearInterval(s.tick); record(i); }
      }, 250);
    } else record(i);
  }
  function record(i) {
    const q = items[i], s = st[i] = { s: "rec", ogg: null, mr: null, chunks: [] };
    drawAct(i);
    // 1) Telegram ovozli xabari formati (OGG/Opus) — WASM kodlovchi, iPhone'da ham
    if (window.Recorder && Recorder.isRecordingSupported()) {
      try {
        const rec = new Recorder({ sourceNode: ctx.createMediaStreamSource(stream), encoderPath: "encoderWorker.min.js",
          numberOfChannels: 1, encoderApplication: 2048, encoderBitRate: 24000, streamPages: false });
        s.oggP = new Promise(res => { rec.ondataavailable = buf => res(new Blob([buf], { type: "audio/ogg" })); });
        rec.start().catch(() => { s.rec = null; });
        s.rec = rec;
      } catch (e) { s.rec = null; }
    }
    // 2) eshitib ko'rish uchun (va zaxira) — brauzerning o'z formatida
    if (window.MediaRecorder) {
      try {
        const mr = new MediaRecorder(stream);
        s.mrP = new Promise(res => { mr.onstop = () => res(new Blob(s.chunks, { type: mr.mimeType || "audio/mp4" })); });
        mr.ondataavailable = e => { if (e.data && e.data.size) s.chunks.push(e.data); };
        mr.start(1000);
        s.mr = mr;
      } catch (e) { s.mr = null; }
    }
    if (!s.rec && !s.mr) { st[i] = { s: "idle" }; setBusy(-1); drawAct(i); show("Yozib bo'lmadi", "Bu brauzer ovoz yozishni qo'llamaydi. Safari yoki Chrome'da oching.", "Yopish"); return; }
    s.t0 = Date.now();
    s.tick = setInterval(() => {
      const el = (Date.now() - s.t0) / 1000;
      const c = $("rc" + i), t = $("tr" + i);
      if (c) c.textContent = mss(el) + " / " + mss(q.sec);
      if (t) t.style.width = Math.min(100, 100 * el / q.sec) + "%";
      if (el >= q.sec) stop(i, true);
    }, 200);
  }
  async function stop(i, auto) {
    const s = st[i];
    if (!s || s.s !== "rec") return;
    clearInterval(s.tick);
    s.s = "wait"; drawAct(i);
    const sec = Math.min(items[i].sec, Math.max(1, Math.round((Date.now() - s.t0) / 1000)));
    try { if (s.rec) s.rec.stop(); } catch (e) {}
    try { if (s.mr && s.mr.state !== "inactive") s.mr.stop(); } catch (e) {}
    const tmo = new Promise(res => setTimeout(() => res(null), 8000));
    const ogg = s.rec ? await Promise.race([s.oggP, tmo]) : null;
    const loc = s.mr ? await Promise.race([s.mrP, tmo]) : null;
    let blob = ogg && ogg.size > 200 ? ogg : loc, url = null;
    if (!blob || blob.size < 200) { st[i] = { s: "idle" }; setBusy(-1); drawAct(i); toast("Ovoz yozilmadi. Qayta urinib ko'ring."); return; }
    const a = document.createElement("audio");
    if (loc && loc.size > 200) url = URL.createObjectURL(loc);
    else if (a.canPlayType("audio/ogg; codecs=opus")) url = URL.createObjectURL(blob);
    st[i] = { s: "ready", blob: blob, mime: blob === ogg ? "audio/ogg" : (blob.type || "audio/mp4"), sec: sec, url: url };
    setBusy(-1); drawAct(i);
    if (auto) toast("⏱ Vaqt tugadi. Eshitib ko'ring va yuboring.");
  }

  // ---------- yuborish ----------
  function b64(blob) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); });
  }
  async function send(i) {
    const s = st[i];
    if (!s || s.s !== "ready") return;
    if (s.sec < 2) { toast("Javob juda qisqa. Qayta yozing."); return; }
    s.s = "sending"; drawAct(i);
    try {
      const data = await b64(s.blob);
      const r = await post({ skill: "speaking", t: TID, k: KEY, i: i, sec: s.sec, mime: s.mime, b64: data });
      if (!r.ok) throw new Error(r.error || "Yuborilmadi");
      done[i] = { sec: r.already ? (r.sec || s.sec) : s.sec };
      if (s.url) URL.revokeObjectURL(s.url);
      delete st[i];
      drawAct(i); drawProg();
      toast(r.already ? "Bu savolga javob avval yuborilgan." : "✅ Yuborildi");
      if (r.complete) { const f = $("foot"); if (f) f.scrollIntoView({ behavior: "smooth" }); }
      else { const nx = items.findIndex((q, j) => !done[j]); if (nx >= 0 && $("q" + nx)) $("q" + nx).scrollIntoView({ behavior: "smooth", block: "center" }); }
    } catch (e) {
      s.s = "ready"; drawAct(i);
      toast("⚠️ " + (e.message === "Failed to fetch" ? "Internet yo'q. Qayta bosing." : e.message));
    }
  }

  // ---------- boshlash ----------
  if (!KEY || !TID || !API) { $("who").textContent = "⛔ Havola noto'g'ri"; show("Havola noto'g'ri", "Telegram'dagi o'zingizning tugmangiz orqali kiring."); return; }
  api({ action: "hello", skill: "speaking", t: TID, k: KEY }).then(r => {
    if (!r.ok) { $("who").textContent = "⛔"; show("Kirib bo'lmadi", esc(r.error)); return; }
    me = r; items = r.items || []; done = r.done || {};
    $("who").textContent = r.name;
    $("ttl").textContent = "Speaking Home task · " + r.title + (r.deadline ? " · " + r.deadline + " gacha" : "");
    document.title = r.title + " · Speaking";
    draw();
    if (r.closed && Object.keys(done).length < items.length) show("Muddat tugagan", "Bu vazifaning muddati tugagan (" + esc(r.deadline) + "). Yuborilmagan javoblarni endi yuborib bo'lmaydi.", "Yopish");
    else hide();
  }).catch(e => { show("Ulanib bo'lmadi", "Internetni tekshirib, sahifani yangilang.<br><small>" + esc(e.message) + "</small>", "Yangilash", () => location.reload()); });
  window.addEventListener("beforeunload", e => { if (busy >= 0 || Object.values(st).some(s => s.s === "ready" || s.s === "sending")) { e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
