<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing uy vazifasi · Dilshod ustoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F6F4;--card:#FFF;--ink:#16181D;--muted:#6B6F76;--line:#E4E4E0;--primary:#E8590C;--ok:#15803D;--bad:#B91C1C;--warn:#B45309}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .who{font-weight:700}
  header .ttl{color:var(--muted);font-size:.85rem}
  header .sp{flex:1}
  .pill{font:600 .95rem 'JetBrains Mono',monospace;background:#F1F1EE;border-radius:9px;padding:6px 12px;white-space:nowrap}
  .pill.low{background:#FEF3C7;color:var(--warn)}
  .pill.end{background:#FEE2E2;color:var(--bad)}
  .btn{border:0;border-radius:10px;padding:9px 18px;font:600 .95rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--primary);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:#ECECE8;color:var(--ink)}
  main{flex:1;display:grid;grid-template-columns:minmax(260px,40%) 1fr;gap:0;min-height:0}
  .prompt{padding:22px 24px;overflow:auto;border-right:1px solid var(--line);background:var(--card)}
  .prompt .tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);margin-bottom:8px}
  .prompt .q{white-space:pre-wrap;font-size:1rem}
  .prompt .rule{margin-top:16px;color:var(--muted);font-size:.85rem}
  .editor{display:flex;flex-direction:column;padding:16px 18px;min-height:0}
  textarea{flex:1;width:100%;min-height:260px;resize:none;border:1px solid var(--line);border-radius:12px;padding:16px;font:16px/1.7 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff;outline:none}
  textarea:focus{border-color:#C9C9C3}
  textarea[readonly]{background:#FAFAF8}
  .foot{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .foot .msg{flex:1;color:var(--muted);font-size:.85rem}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:.9rem;display:none;z-index:50}
  #cover{position:fixed;inset:0;background:rgba(22,24,29,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  #cover .card{background:#fff;max-width:460px;width:100%;border-radius:16px;padding:24px;text-align:center}
  #cover h3{margin:0 0 8px;font-size:1.2rem}
  #cover .btn{margin-top:16px}
  .hide{display:none!important}
  @media (max-width:760px){
    main{grid-template-columns:1fr;grid-auto-rows:auto}
    .prompt{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
    textarea{min-height:48vh}
    header{padding:8px 12px;gap:8px}
  }
</style>
</head>
<body>
<header>
  <div><div class="who" id="who">Yuklanmoqda…</div><div class="ttl" id="ttl"></div></div>
  <div class="sp"></div>
  <span class="pill" id="wc">0 so'z</span>
  <span class="pill" id="clock">--:--</span>
  <button class="btn" id="btnSubmit" disabled>Topshirish</button>
</header>
<main>
  <section class="prompt">
    <div class="tag" id="task">Writing</div>
    <div class="q" id="prompt"></div>
    <div class="rule" id="rule"></div>
  </section>
  <section class="editor">
    <textarea id="ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Essayingizni shu yerga yozing…" readonly></textarea>
    <div class="foot"><div class="msg" id="msg">Matningiz shu qurilmada saqlanib boradi.</div></div>
  </section>
</main>
<div id="cover"><div class="card" id="card"><h3>Yuklanmoqda…</h3><div>Bir soniya kuting.</div></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const API = window.HW_API, TID = P.get("t") || "", KEY = P.get("k") || "";
  const ST = "hww_" + TID + "_" + KEY + "_st", PEND = "hww_" + TID + "_" + KEY + "_pend";
  const ed = $("ed");
  let me = null, left = 0, total = 0, run = false, done = false, pastes = 0, leaves = 0, tick = null;

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function words(s) { return (String(s || "").match(/[A-Za-z0-9À-ɏ'’-]+/g) || []).length; }
  function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function show(title, body, btn, fn, btn2, fn2) {
    $("card").innerHTML = `<h3>${title}</h3><div>${body}</div>` + (btn ? `<button class="btn" id="cBtn">${btn}</button>` : "") + (btn2 ? ` <button class="btn sec" id="cBtn2">${btn2}</button>` : "");
    $("cover").classList.remove("hide");
    if (btn) $("cBtn").onclick = fn || hide;
    if (btn2) $("cBtn2").onclick = fn2 || hide;
  }
  function hide() { $("cover").classList.add("hide"); }
  let toastT = null;
  function toast(t) { $("toast").textContent = t; $("toast").style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => { $("toast").style.display = "none"; }, 2600); }
  function api(q) { return fetch(API + "?" + new URLSearchParams(q), { redirect: "follow" }).then(r => r.json()); }
  function post(b) { return fetch(API, { method: "POST", body: JSON.stringify(b), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow" }).then(r => r.json()); }

  function drawWc() {
    const n = words(ed.value), min = me ? me.min_words : 0;
    $("wc").textContent = n + (min ? " / " + min : "") + " so'z";
    $("wc").classList.toggle("low", !!min && n < min);
  }
  function drawClock() {
    $("clock").textContent = mmss(left);
    $("clock").classList.toggle("low", run && left <= 300 && left > 0);
    $("clock").classList.toggle("end", left <= 0);
  }
  function save() { if (me && run && !done) lsSet(ST, { text: ed.value, left: left, pastes: pastes, leaves: leaves }); }
  ed.addEventListener("input", () => { drawWc(); save(); });
  setInterval(save, 3000);
  window.addEventListener("beforeunload", save);

  // nusxa qo'yish va sudrab tashlash yopiq
  ["paste", "drop"].forEach(ev => ed.addEventListener(ev, e => { e.preventDefault(); if (run) { pastes++; save(); toast("📋 Nusxa ko'chirib qo'yish mumkin emas. O'zingiz yozing."); } }));
  ed.addEventListener("beforeinput", e => { if (e.inputType === "insertFromPaste" || e.inputType === "insertFromDrop") e.preventDefault(); });
  ed.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("visibilitychange", () => { if (document.hidden && run && !done) { leaves++; save(); } });

  function start(st) {
    hide();
    if (st) { ed.value = st.text || ""; left = typeof st.left === "number" ? st.left : total; pastes = st.pastes || 0; leaves = st.leaves || 0; }
    run = true; ed.readOnly = false; ed.focus(); $("btnSubmit").disabled = false;
    drawWc(); drawClock();
    let last = Date.now();
    tick = setInterval(() => {
      const now = Date.now(); left -= (now - last) / 1000; last = now;
      drawClock();
      if (left <= 0) { clearInterval(tick); submit(true); }
    }, 500);
  }
  function lock(text, info) {
    run = false; done = true; clearInterval(tick);
    ed.value = text || ""; ed.readOnly = true; $("btnSubmit").disabled = true; $("btnSubmit").textContent = "Topshirildi ✓";
    drawWc(); $("msg").innerHTML = info;
  }
  function send(payload) {
    $("msg").textContent = "⏳ Yuborilmoqda…";
    lsSet(PEND, payload);
    post(payload).then(r => {
      if (!r.ok) throw new Error(r.error || "Yuborilmadi");
      lsDel(ST); lsDel(PEND);
      lock(payload.text, `<b style="color:var(--ok)">✅ Topshirildi: ${r.words} so'z. Matningiz topic'ingizga yuborildi.</b> Feedback ustoz tekshirgandan keyin keladi.`);
      show("✅ Topshirildi", `${esc(me.name)}, essayingiz (${r.words} so'z) ustozga yuborildi.<br>Feedback topic'ingizga keladi.`, "Yaxshi");
    }).catch(e => {
      $("msg").innerHTML = `<b style="color:var(--bad)">⚠️ ${esc(e.message || "Internet xatosi")}.</b> <button class="btn sec" id="retry">Qayta yuborish</button>`;
      $("retry").onclick = () => send(payload);
    });
  }
  function submit(timeUp) {
    if (!run || done) return;
    const n = words(ed.value);
    const go = () => {
      run = false; clearInterval(tick); ed.readOnly = true; $("btnSubmit").disabled = true; hide();
      send({ skill: "writing", k: KEY, t: TID, text: ed.value, minutes: Math.ceil((total - Math.max(0, left)) / 60), timeUp: !!timeUp, pastes: pastes, leaves: leaves });
    };
    if (timeUp) {
      if (!ed.value.trim()) { run = false; ed.readOnly = true; $("btnSubmit").disabled = true; show("⏰ Vaqt tugadi", "Hech narsa yozilmagan, shuning uchun hech narsa yuborilmadi."); return; }
      go(); return;
    }
    if (!ed.value.trim()) { toast("Avval essay yozing."); return; }
    show("Topshiramizmi?", `${n} so'z yozdingiz` + (n < me.min_words ? ` (talab: kamida ${me.min_words}).` : ".") + "<br>Topshirgandan keyin o'zgartirib bo'lmaydi.", "Ha, topshiraman", go, "Yozishda davom etaman");
  }
  $("btnSubmit").onclick = () => submit(false);

  if (!KEY || !TID || !API) { $("who").textContent = "⛔ Havola noto'g'ri"; show("Havola noto'g'ri", "Telegram'dagi o'zingizning tugmangiz orqali kiring."); return; }
  api({ action: "hello", skill: "writing", k: KEY, t: TID }).then(r => {
    if (!r.ok) { $("who").textContent = "⛔ " + (r.error || "Xato"); show("Kirish mumkin emas", esc(r.error || "Xato")); return; }
    me = r; total = (r.minutes || 40) * 60; left = total;
    $("who").textContent = r.name; $("ttl").textContent = r.title + " · muddat: " + r.deadline;
    $("task").textContent = "Writing " + (r.task || "Task 2") + " · " + r.minutes + " daqiqa";
    $("prompt").textContent = r.prompt;
    $("rule").textContent = `Kamida ${r.min_words} so'z yozing. Nusxa ko'chirib qo'yish ishlamaydi. Vaqt tugaganda yozganingiz avtomatik topshiriladi.`;
    document.title = r.title + " · Writing";
    drawWc(); drawClock();
    if (r.submitted) {
      lock(r.sub.text, `<b style="color:var(--ok)">✅ Siz bu vazifani topshirgansiz (${r.sub.words} so'z).</b> Feedback ustoz tekshirgandan keyin keladi.`);
      show("Siz bu vazifani topshirgansiz", `${esc(r.name)}, essayingiz (${r.sub.words} so'z) ustozga yuborilgan. Feedback topic'ingizga keladi.`, "Matnimni ko'rish");
      return;
    }
    const pend = lsGet(PEND);
    if (pend) {
      ed.value = pend.text || ""; drawWc();
      show("Yuborilmay qolgan essay bor", "Oldingi safar essayingiz yuborilmay qolgan. Hozir yuboramiz.", "Yuborish", () => { hide(); send(pend); });
      return;
    }
    if (r.closed) { show("Muddat tugagan", "Topshirish muddati (" + esc(r.deadline) + ") o'tib ketgan."); return; }
    const st = lsGet(ST);
    if (st && (st.text || "").trim()) {
      ed.value = st.text; drawWc(); left = typeof st.left === "number" ? st.left : total; drawClock();
      show("Davom ettiramiz", `Matningiz saqlangan (${words(st.text)} so'z). Qolgan vaqt: ${mmss(left)}.`, "▶ Davom ettirish", () => start(st));
      return;
    }
    show(`Assalomu alaykum, ${esc(r.name)}!`,
      `${esc(r.title)} · Writing<br><br>⏱ Vaqt: ${r.minutes} daqiqa, <b>Boshlash</b> bosilgandan keyin yuradi.<br>📝 Kamida ${r.min_words} so'z.<br>Oxirida <b>Topshirish</b> ni bosing: essayingiz topic'ingizga ustozga yuboriladi.<br><br>⚠️ Faqat bir marta topshirish mumkin.`,
      "▶ Boshlash", () => start(null));
  }).catch(() => {
    $("who").textContent = "⚠️ Internet xatosi";
    show("Internet xatosi", "Ulanishni tekshirib, sahifani yangilang.", "Yangilash", () => location.reload());
  });
})();
</script>
</body>
</html>
