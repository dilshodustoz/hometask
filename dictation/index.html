<style>
body{margin:0}
/* Layout: one working column — controls strip, dark "subtitle stage" as the hero, results below. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#13232a; --muted:#5b6e75; --line:#d3dde0;
  --stage:#0f2228; --stage2:#16323a; --sub:#f3f6f4; --subdim:#7f979d;
  --accent:#e39b2d; --accent-ink:#3a2300; --ok:#1f9d6b; --bad:#d6453d; --okbg:#e3f5ec; --badbg:#fbe7e5;
  --chip:#e4ecee;
  --f-sub:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-head:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1518; --surface:#122126; --ink:#e4eef0; --muted:#93a8ae; --line:#24393f;
  --stage:#07161a; --stage2:#0f262c; --chip:#1b2f35; --okbg:#123326; --badbg:#3a1b19; --accent-ink:#2a1900; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1518; --surface:#122126; --ink:#e4eef0; --muted:#93a8ae; --line:#24393f;
  --stage:#07161a; --stage2:#0f262c; --chip:#1b2f35; --okbg:#123326; --badbg:#3a1b19; --accent-ink:#2a1900; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sub);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-head);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-head);font-weight:700;font-size:1.15rem;margin:0}

.vtab span{display:block;font-size:.78rem;color:var(--muted);line-height:1.3}
.vtab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vtab:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:700px){.vtabs{grid-template-columns:repeat(2,1fr)}.vtab:last-child{grid-column:span 2}}
.vdesc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.vdesc>div:first-child{max-width:75ch}
.vdesc p{margin:0}
.vdesc .how{color:var(--muted);font-size:.9rem}

.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 9px;font-size:.85rem}

.stage{background:var(--stage);border-radius:16px;color:var(--sub);padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;min-height:320px;position:relative;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--subdim);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bar{height:4px;background:var(--stage2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.hist{display:flex;flex-direction:column;gap:4px;min-height:58px;justify-content:flex-end}
.hist div{color:var(--subdim);font-size:1rem;line-height:1.35}
.hist .okw{color:#7fd8ae}
.line{font-size:1.65rem;line-height:1.6;text-align:center;min-height:5.2em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 .32em;padding:6px 0}

.w.said{color:var(--sub)}

.w.shown{color:var(--accent);font-weight:700}
.bw{display:inline-flex;align-items:baseline}

.blank.now input{animation:pulse .5s ease-in-out 2}
.blank.wrong input{border-bottom-color:var(--bad);animation:shake .35s}
.blank.locked input{opacity:.7}
.blank .q{position:absolute;top:-1.15em;font-size:.55em;color:var(--accent);font-family:var(--f-mono);letter-spacing:.04em}
.blank .hint{font-family:var(--f-mono);font-size:.5em;color:var(--accent);letter-spacing:.18em;line-height:1.2;min-height:1.2em}

.chips .btn.sel-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chips .btn.sel-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.pending{display:flex;flex-direction:column;gap:6px}
.pcard{background:var(--stage2);border-radius:10px;padding:8px 10px;font-size:1.05rem;display:flex;flex-direction:column;gap:6px}
.pcard .t{display:flex;flex-wrap:wrap;gap:0 .3em;align-items:baseline}
.pcard .tl{height:3px;background:#28474f;border-radius:2px;overflow:hidden}.pcard .tl i{display:block;height:100%;background:var(--accent);width:100%}
.splash{position:absolute;inset:0;background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.splash p{margin:0;color:var(--subdim);max-width:46ch}
.splash .big{font-family:var(--f-head);font-size:1.4rem;color:var(--sub)}
.lvl{display:inline-flex;gap:3px;align-items:center}.lvl i{width:16px;height:6px;border-radius:2px;background:#28474f}.lvl i.on{background:var(--accent)}
kbd{font-family:var(--f-mono);font-size:.78em;border:1px solid #2d4c54;border-radius:4px;padding:0 4px;color:var(--subdim)}
/* results */
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-head);font-size:1.45rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.m{font-family:var(--f-mono);font-size:.85rem}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.75rem;background:var(--chip);color:var(--muted)}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.ok{background:var(--okbg);color:var(--ok)}
.note{color:var(--muted);font-size:.85rem;margin:0}
.foot{color:var(--muted);font-size:.82rem}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
.stage.hidetext .line .w:not(.said){visibility:hidden}
.stage.hidetext .line .blank:not(.seen){visibility:hidden}
.foot a{color:inherit}
</style>
</head><body>


<div class="wrap">

const $=id=>document.getElementById(id);
const clean=w=>w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'£$.\-]/g,"").replace(/^[.\-']+|[.\-']+$/g,"");
const NUMW=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
function canon(s){s=s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim().replace(/^[^a-z0-9£$]+|[^a-z0-9%]+$/g,"");
  if(/^[a-z](-[a-z])+$/.test(s)) s=s.replace(/-/g,"");

function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d;}
function diffHTML(typed,target){ // colour typed letters without revealing target
  const a=typed.toLowerCase(),b=target.toLowerCase(),d=lev(a,b);let i=a.length,j=b.length,out=[];
  while(i>0||j>0){

    else if(i>0&&j>0&&d[i][j]==d[i-1][j-1]+1){out.unshift(`<span class="x">${esc(typed[i-1])}</span>`);i--;j--;}

function scoreContent(c,w){

function adapt(firstTry){
  if(firstTry){S.streak++;S.hard=0;if(S.streak>=3&&S.level<4){S.level++;S.streak=0;toast(`Daraja oshdi: ${S.level}`);}}
  else{S.streak=0;const m=Math.max(...plan(S.cur).map(b=>b.miss));if(m>=2){S.hard++;if(S.hard>=2&&S.level>1){S.level--;S.hard=0;toast(`Daraja pasaydi: ${S.level}`);}}}
  S.levelHist.push(S.level);}
function toast(t){$("fb").innerHTML+=` <span class="tag ok">${t}</span>`;}
function next(){
  pushHist(S.cur);
  let ni;
  if(S.remed){ni=S.remed.list[++S.remed.k];if(ni==null){finish();return;}}
  else{ni=S.cur+1;if(ni>S.to){finish();return;}}
  $("fb").innerHTML="";
  const c=P.chunks[ni];
  if(V===2&&!S.remed&&stops(ni)&&!S.plans[ni].predDone){S.cur=ni;S.state="predict";render(ni);enterPredict();return;}
  // V2 continues flowing from where audio is; others jump to chunk start
  playFrom(ni,c.s);
}
function replay(kind,auto){
  if(!S||S.state!=="answer")return;
  if(!auto) S.replays++;
  const c=P.chunks[S.cur],b=curBlanks()[0];const w=b?c.words[b.ids[0]]:c.words[0];
  const r=rate;
  if(kind==="chunk") playSeg(c.s,c.stopAt,focusFirst);
  else if(kind==="back") playSeg(Math.max(c.s,w.s-3),c.stopAt,focusFirst);
  else { const prev=c.words[w.wi-1]; const from=Math.max(c.s, prev? prev.s : w.s-0.15); const wl=c.words[(b?b.ids[b.ids.length-1]:0)];
    const old=rate;rate=Math.min(rate,0.85);playSeg(from,wl.e+0.18,()=>{rate=old;audio.playbackRate=rate;focusFirst();});}
}
function togglePause(){if(!S)return;if(audio.paused){audio.play();$("bPause").textContent="⏸ To'xtat";loop();}else{audio.pause();$("bPause").textContent="▶ Davom";}}

/* ---------- V2 prediction ---------- */
function enterPredict(){
  const c=P.chunks[S.cur],b=plan(S.cur)[0],w=c.words[b.ids[0]];
  const right=wordType(w);
  $("fb").innerHTML=`<span class="tip">Audio shu gapdan oldin to'xtadi. Matnni o'qing: bo'sh joyga qanday so'z keladi?</span>`;
  $("chips").hidden=false;
  $("chips").innerHTML=Object.entries(WT).map(([k,v])=>`<button class="btn" data-k="${k}">${v}</button>`).join("");
  setCtrl(["bEnd"]);
  $("chips").onclick=e=>{const bt=e.target.closest("button");if(!bt)return;const ok=bt.dataset.k===right;S.pred.n++;if(ok)S.pred.ok++;
    bt.classList.add(ok?"sel-ok":"sel-bad");if(!ok)$("chips").querySelector(`[data-k="${right}"]`).classList.add("sel-ok");
    $("fb").innerHTML=ok?`<b style="color:#7fd8ae">Taxmin to'g'ri.</b> Endi eshiting.`:`<span class="tip">Bu yerda: ${WT[right]}. Endi eshiting.</span>`;
    $("chips").onclick=null;S.plans[S.cur].predDone=true;
    setTimeout(()=>{$("chips").hidden=true;playFrom(S.cur,c.s);},ok?700:1300);};
}

/* ---------- V5 cards ---------- */
function addCard(ci){
  const pl=plan(ci);if(!pl.length)return;
  const c=P.chunks[ci],b=pl[0];
  const words=b.ids.map(i=>c.words[i]);
  const card={ci,b,words,locked:false,deadline:null,id:"pc_"+ci};
  S.cards.forEach(k=>{if(!k.locked&&k.deadline==null)k.deadline=Math.max(c.stopAt,k.minDl);});
  card.minDl=c.stopAt+7;card.deadline=null;
  S.cards.push(card);
  const t=c.words.map(w=>b.ids.includes(w.wi)?(w.wi===b.ids[0]?`<span class="blank"><input id="${card.id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:${b.ids.length>1?14:8}ch" aria-label="Bo'sh joy"></span>`:""):`<span>${esc(w.t)}</span>`).join(" ");
  $("pending").insertAdjacentHTML("afterbegin",`<div class="pcard" id="w_${card.id}"><div class="t">${t}</div><div class="tl"><i></i></div></div>`);
  const pc=$("pending");while(pc.children.length>3)pc.lastChild.remove();
  setTimeout(()=>$(card.id)&&$(card.id).focus({preventScroll:true}),20);
}
function cardsTick(t){
  S.cards.forEach(k=>{if(k.locked)return;
    const dl=k.deadline??Math.max(k.minDl, P.chunks[k.ci].stopAt+7);
    const el=document.querySelector(`#w_${k.id} .tl i`);const span=dl-P.chunks[k.ci].s;
    if(el) el.style.width=Math.max(0,(dl-t)/span*100)+"%";
    if(t>=dl) lockCard($(k.id),true);});
}
function lockCard(inp,timeout){
  if(!inp)return;const k=S.cards.find(x=>x.id===inp.id);if(!k||k.locked)return;
  k.locked=true;inp.disabled=true;inp.closest(".blank").classList.add("locked");
  const typed=inp.value.trim(),tgt=k.words.map(w=>w.t).join(" ");
  const ok=canon(typed)===canon(tgt)||typed.split(/\s+/).map(canon).join(" ")===k.words.map(w=>canon(w.t)).join(" ");
  S.log.push({ci:k.ci,ans:tgt,typed:[typed],miss:ok?0:1,first:ok,shown:false,q:k.b.q,s:k.words[0].s,e:k.words[k.words.length-1].e,timeout:timeout&&!typed});
  const box=$("w_"+k.id);if(box)box.style.opacity=.55;
  const nxt=S.cards.find(x=>!x.locked);if(nxt&&$(nxt.id))$(nxt.id).focus({preventScroll:true});
  render(S.cur);
}

/* ---------- sound ---------- */
let AC;function ding(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=ok?880:220;g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(ok?.25:.35));o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.4);}catch(e){}}

/* ---------- finish ---------- */
function finish(){
  if(!S||S.state==="end")return;
  if(V===5&&!S.remed) S.cards.forEach(k=>{if(!k.locked)lockCard($(k.id),true);});
  stopLoop();audio.pause();S.state="end";setCtrl([]);
  $("splash").hidden=false;$("spT").textContent="Tugadi";$("spP").textContent="Natijalar pastda.";
  const L=S.log,n=L.length,first=L.filter(l=>l.first).length,mins=((Date.now()-S.t0)/60000).toFixed(1);
  const wrong=L.filter(l=>!l.first);
  const cat=l=>{const t=canon(l.typed[0]||""),g=canon(l.ans);if(!t)return l.timeout?"ulgurmadi":"bo'sh";if(g===t+"s"||t===g+"s")return "-s qo'shimcha";const d=lev(t,g)[t.length][g.length];return d<=2&&g.length>3?"imlo":"boshqa so'z";};
  const cats={};wrong.forEach(l=>{const c=cat(l);cats[c]=(cats[c]||0)+1;});
  const prev=store("ad_hist")||[];const rec={v:V,part:P.id,n,first,date:new Date().toISOString().slice(0,16),mins};
  store("ad_hist",[rec].concat(prev).slice(0,20));
  const pct=n?Math.round(first/n*100):0;
  let h=`<h2>Natija · ${VERS[V-1].name}${S.remed?" (xatolar ustida)":""}</h2>
  <div class="stats">
   <div class="stat"><b>${first}/${n}</b><span>birinchi urinishda to'g'ri (${pct}%)</span></div>
   <div class="stat"><b>${L.reduce((s,l)=>s+l.miss,0)}</b><span>jami xato urinish</span></div>
   <div class="stat"><b>${S.replays}</b><span>o'zi bosgan qayta eshitish</span></div>
   <div class="stat"><b>${mins}</b><span>daqiqa</span></div>
   ${V===2?`<div class="stat"><b>${S.pred.ok}/${S.pred.n}</b><span>so'z turi to'g'ri taxmin</span></div>`:""}
   ${V===4?`<div class="stat"><b>${Math.max(1,...S.levelHist,S.level)}</b><span>eng yuqori daraja</span></div>`:""}
  </div>`;
  if(Object.keys(cats).length) h+=`<p class="note">Xato turlari: ${Object.entries(cats).map(([k,v])=>`<span class="tag bad">${k}: ${v}</span>`).join(" ")}</p>`;
  if(wrong.length){
    h+=`<div class="tbl"><table><thead><tr><th>So'z</th><th>Siz yozdingiz</th><th>Turi</th><th></th></tr></thead><tbody>`+
    wrong.map((l,i)=>`<tr><td><b>${esc(l.ans)}</b>${l.q?` <span class="tag">Q${l.q}</span>`:""}</td><td class="m">${l.typed.map(esc).join(" → ")||"—"}</td><td><span class="tag bad">${cat(l)}</span></td><td><button class="btn sm" data-play="${i}">▶</button></td></tr>`).join("")+`</tbody></table></div>`;
  } else h+=`<p class="note">Xato yo'q. Keyingi qismni yoki qiyinroq versiyani sinab ko'ring.</p>`;
  h+=`<div class="pick">`+(wrong.length?`<button class="btn primary" id="bRem">Xatolarni mashq qilish (${new Set(wrong.map(l=>l.ci)).size} gap)</button>`:"")+`<button class="btn" id="bCopy">Natijani nusxalash</button><button class="btn" id="bAgain">Qaytadan</button></div>`;
  if(prev.length) h+=`<p class="note">Oldingi urinishlar: ${prev.slice(0,5).map(r=>`V${r.v} ${r.part}: ${r.first}/${r.n}`).join(" · ")}</p>`;
  h+=`<p class="note" id="sendSt">Natija ustozga yuborilmoqda…</p>`;
  $("res").innerHTML=h;$("res").hidden=false;
  if(n) sendLog({v:V,part:P.id,r:S.remed?1:0,rg:S.remed?"":(S.from+1)+"-"+(S.to+1),n,first,miss:L.reduce((s,l)=>s+l.miss,0),rep:S.replays,min:+mins,
    pred:V===2?S.pred.ok+"/"+S.pred.n:"",lvl:V===4?Math.max(1,...S.levelHist,S.level):"",
    wrong:wrong.slice(0,20).map(l=>l.ans+"="+(l.typed[0]||"-"))},$("sendSt"));
  else $("sendSt").textContent="";
  $("res").onclick=e=>{const p=e.target.closest("[data-play]");if(p){const l=wrong[+p.dataset.play];audio.currentTime=Math.max(0,l.s-1.5);stopTime=l.e+0.5;onStop=null;audio.play();loop();}};
  if($("bRem")) $("bRem").onclick=()=>remediate([...new Set(wrong.map(l=>l.ci))].sort((a,b)=>a-b));
  $("bAgain").onclick=start;
  $("bCopy").onclick=()=>{const txt=`Auto Dictation · ${VERS[V-1].name} · ${P.set} ${P.title}\n1-urinishda: ${first}/${n} (${pct}%), qayta eshitish: ${S.replays}, ${mins} daq.\nXatolar: `+wrong.map(l=>`${l.ans} (${l.typed.join(" → ")||"—"})`).join("; ");
    const done=()=>{$("bCopy").textContent="Nusxa olindi";};navigator.clipboard?.writeText(txt).then(done,()=>{$("res").insertAdjacentHTML("beforeend",`<textarea style="width:100%;height:90px">${esc(txt)}</textarea>`);});};
  $("res").scrollIntoView({behavior:"smooth",block:"start"});
}
function remediate(list){
  const v=V;S={...S,remed:{list,k:0},plans:{},log:[],replays:0,state:"idle",t0:Date.now()};
  $("splash").hidden=true;$("res").hidden=true;$("pending").hidden=true;$("hist").innerHTML="";
  S.from=0;S.to=list.length-1;
  const ci=list[0];S.cur=ci;
  // progress counter uses remed index
  playFrom(ci,P.chunks[ci].s);
}
fetch("data.json?v=1").then(r=>r.json()).then(d=>{DATA=d;DATA.forEach(prepPart);P=DATA[0];initUI();}).catch(()=>{$("spT").textContent="Yuklanmadi";$("spP").textContent="Internetni tekshirib, sahifani yangilang.";});
</script>
