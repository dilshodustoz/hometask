<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mening mashqim · Dilshod ustoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F6F4;--card:#FFF;--ink:#16181D;--muted:#6B6F76;--line:#E4E4E0;--primary:#E8590C;--ok:#15803D;--bad:#DC2626;--warn:#B45309}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  header>div:first-child{flex:1;min-width:0}
  .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font:600 .9rem 'JetBrains Mono',monospace;background:#F1F1EE;border-radius:9px;padding:6px 12px;white-space:nowrap}
  .pill.ok{background:#DCFCE7;color:var(--ok)}
  .btn{border:0;border-radius:10px;padding:10px 18px;font:600 .95rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--primary);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:#ECECE8;color:var(--ink)}
  main{max-width:820px;margin:0 auto;padding:16px 14px 100px}
  .intro{background:#FFF7ED;border:1px solid #FED7AA;border-radius:14px;padding:12px 16px;font-size:.92rem;color:#7C2D12;margin-bottom:14px}
  .intro ol{margin:6px 0 0 18px;padding:0}
  .banner{border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:.93rem}
  .banner.wait{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A}
  .banner.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#14532D}
  .banner.re{background:#FEF2F2;border:1px solid #FECACA;color:#7F1D1D}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:14px 16px}
  .sec h2{margin:0 0 4px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
  .sec h2 .cnt{margin-left:auto;font:600 .8rem 'JetBrains Mono',monospace;color:var(--muted);background:#F1F1EE;border-radius:8px;padding:3px 8px}
  .sec h2 .cnt.ok{background:#DCFCE7;color:var(--ok)}
  .hint{color:var(--muted);font-size:.86rem;margin:0 0 10px}
  .rule{background:#EEF2FF;border-radius:10px;padding:9px 12px;font-size:.88rem;color:#312E81;margin:8px 0}
  .rule b{color:#3730A3}
  .item{border-top:1px solid #F0F0EC;padding:12px 0}
  .item:first-of-type{border-top:0}
  .q{font-weight:600;margin-bottom:7px}
  .q .n{color:var(--muted);font-weight:700;margin-right:5px}
  .tag{display:inline-block;font-size:.74rem;font-weight:700;background:#FEF3C7;color:#92400E;border-radius:7px;padding:1px 8px;margin-left:6px;vertical-align:1px}
  .orig u{text-decoration:underline wavy var(--bad) 2px;text-underline-offset:4px;background:#FEF2F2;border-radius:4px;padding:0 2px}
  .orig .ins{color:var(--bad);font-size:1.25em;line-height:0;margin:0 1px}
  .orig{font-size:.9rem;color:#3F4349;background:#FAFAF8;border:1px dashed var(--line);border-radius:10px;padding:8px 11px;margin-bottom:7px}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:15px/1.5 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff;outline:none;resize:vertical;min-height:64px}
  textarea:focus{border-color:#BDBDB6}
  textarea[readonly]{background:#FAFAF8}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font:500 .93rem 'Plus Jakarta Sans',sans-serif;color:var(--ink);text-align:left}
  .opt.sel{border-color:var(--primary);background:#FFF7ED;color:#9A3412;font-weight:600}
  .opt.good{border-color:#86EFAC;background:#DCFCE7;color:var(--ok);font-weight:600}
  .opt.badc{border-color:#FCA5A5;background:#FEE2E2;color:var(--bad);text-decoration:line-through}
  .opt:disabled{cursor:default}
  .verd{margin-top:7px;font-size:.88rem;border-radius:10px;padding:8px 11px}
  .verd.ok{background:#F0FDF4;color:#14532D}.verd.no{background:#FEF2F2;color:#7F1D1D}.verd.wait{background:#EFF6FF;color:#1E3A8A}
  .sample{margin-top:6px;font-size:.88rem;color:#14532D}
  .iz{font-size:.84rem;color:var(--muted);margin-top:5px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:20}
  .foot .st{flex:1;color:var(--muted);font-size:.85rem}
  .hide{display:none!important}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  #modal .box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:20px}
  #modal h3{margin:0 0 8px}#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  @media (max-width:560px){.opt{flex:1 1 100%}}
</style>
</head>
<body>
<header><div><div class="who" id="who">Yuklanmoqda…</div><div class="ttl" id="ttl"></div></div><div class="pill" id="score">—</div></header>
<main id="main"></main>
<div class="foot hide" id="foot"><div class="st" id="fst"></div><button class="btn" id="btnGo">Topshirish</button></div>
<div id="modal" class="hide"><div class="box"><h3 id="mt"></h3><div id="mb"></div><div class="acts" id="ma"></div></div></div>
<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), P = new URLSearchParams(location.search);
  const API = window.HW_API, TID = P.get("t") || "", KEY = P.get("k") || "";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const api = q => fetch(API + "?" + new URLSearchParams(q), { redirect: "follow" }).then(r => r.json());
  const post = b => fetch(API, { method: "POST", body: JSON.stringify(b), headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow" }).then(r => r.json());
  const LS = "mq_" + TID + "_" + KEY;
  const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { return null; } };
  const lsSet = v => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} };
  function modal(t, b, btns) {
    $("mt").textContent = t; $("mb").innerHTML = b; $("ma").innerHTML = "";
    (btns || [["Yopish", null]]).forEach(([lab, fn, sec]) => { const x = document.createElement("button"); x.className = "btn" + (sec ? " sec" : ""); x.textContent = lab; x.onclick = () => { $("modal").classList.add("hide"); fn && fn(); }; $("ma").appendChild(x); });
    $("modal").classList.remove("hide");
  }
  let R = null, ans = { A: [], B: [], C: [], D: [] }, pastes = 0, leaves = 0, active = 0, busy = false;
  // variantlar tartibi: kalit bo'yicha barqaror aralashtirish
  function order(n, seed) { const a = [...Array(n).keys()]; let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0; for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  setInterval(() => { if (!document.hidden) active++; }, 1000);
  document.addEventListener("visibilitychange", () => { if (document.hidden && R && (R.phase === "new" || R.phase === "retry")) leaves++; });
  document.addEventListener("paste", e => { if (e.target && e.target.tagName === "TEXTAREA") { e.preventDefault(); pastes++; save(); modal("Nusxa qo'yish ishlamaydi", "Gapni o'zingiz yozing."); } });

  function save() { if (R && (R.phase === "new" || R.phase === "retry")) lsSet({ phase: R.phase, ans: ans, pastes: pastes, leaves: leaves }); progress(); }
  function progress() {
    if (!R) return;
    const M = R.me;
    if (R.phase === "new") {
      const tot = M.A.length + M.B.length + M.C.length + M.D.length;
      const done = M.A.filter((x, i) => (ans.A[i] || "").trim() && (ans.A[i] || "").trim() !== x.s).length + ["B", "C", "D"].reduce((s, k) => s + M[k].filter((_, i) => ans[k][i] !== "" && ans[k][i] != null).length, 0);
      $("score").textContent = done + " / " + tot; $("fst").textContent = "Javob berilgan: " + done + " / " + tot;
    } else if (R.phase === "retry") {
      const w = wrongIdx(), d = w.filter(i => (ans.A[i] || "").trim()).length;
      $("fst").textContent = "Qayta yozilgan: " + d + " / " + w.length;
    }
  }
  const wrongIdx = () => (R.f1 || []).map((x, i) => x && !x.ok ? i : -1).filter(i => i >= 0);

  function optsHtml(sec, i, item, chosen, key) {
    const ord = order(item.o.length, KEY + sec + i);
    return `<div class="opts">` + ord.map(j => {
      let c = "opt";
      if (key != null) { if (j === key) c += " good"; else if (j === chosen) c += " badc"; }
      else if (chosen === j) c += " sel";
      return `<button class="${c}" data-s="${sec}" data-i="${i}" data-j="${j}"${key != null ? " disabled" : ""}>${esc(item.o[j])}</button>`;
    }).join("") + `</div>`;
  }
  function render() {
    const M = R.me, ph = R.phase, graded = !!R.g, out = [];
    $("who").textContent = R.name; $("ttl").textContent = R.title + (R.deadline ? " · muddat: " + R.deadline : "");
    if (ph === "new") {
      out.push(`<div class="intro"><b>${esc(R.name)}, bu mashq sizning o'z xatolaringizdan tuzilgan.</b> Oxirgi essaylaringizda eng ko'p takrorlangan xatolar: <b>${esc(M.focus.join(", ") || "grammatika")}</b>.<ol>
        <li><b>A.</b> Xatoni to'g'rilang: xato qismi qizil chiziq bilan belgilangan. To'g'ri variantini o'zingiz topib, gapni qayta yozing.</li>
        <li><b>B.</b> Qoidani o'qing va to'g'ri variantni tanlang.</li><li><b>C.</b> O'zingiz adashgan so'zlar.</li><li><b>D.</b> Reading: sinonimni toping.</li></ol>
        <div style="margin-top:6px">B, C, D darhol tekshiriladi. A bo'limni ustoz tekshiradi, keyin noto'g'ri gaplarni ikkinchi marta to'g'rilaysiz. Javoblaringiz shu qurilmada saqlanib boradi.</div></div>`);
    } else if (ph === "wait1" || ph === "wait2") {
      out.push(`<div class="banner wait">⏳ <b>${ph === "wait1" ? "Topshirdingiz." : "2-urinish yuborildi."}</b> A bo'limdagi gaplaringizni ustoz tekshirmoqda. Izoh tayyor bo'lganda kabinetingizga xabar keladi.</div>`);
    } else if (ph === "retry") {
      out.push(`<div class="banner re">🔁 <b>A bo'lim tekshirildi.</b> ❌ belgili gaplarni izohni o'qib, ikkinchi marta to'g'rilang va yuboring.</div>`);
    } else if (ph === "done") {
      out.push(`<div class="banner ok">✅ <b>Mashq yakunlandi.</b> Natija: <b>${esc(R.pct)}%</b>. Pastda har bir javob, izoh va to'g'ri variant bor.</div>`);
    }
    // A
    if (M.A.length) {
      const f1 = R.f1 || [], f2 = R.f2 || [];
      out.push(`<div class="sec"><h2>✍️ A. Xatoni to'g'rilang<span class="cnt" id="cA">${M.A.length} ta</span></h2><p class="hint">Har bir gapda siz essaylaringizda qilgan xato bor. <b>Qizil chiziq bilan belgilangan so'zlarda xato bor</b>, <b style="color:var(--bad)">‸</b> belgisi esa so'z tushib qolgan joyni ko'rsatadi. To'g'ri variantini o'zingiz topib, butun gapni qayta yozing.</p>`);
      M.A.forEach((x, i) => {
        const v1 = R.a1 ? (R.a1.A || [])[i] || "" : null, v2 = R.a2 ? (R.a2.A || [])[i] || "" : null;
        let hl = "", pos = 0;
        (x.hl || []).slice().sort((p, q) => p[0] - q[0]).forEach(([st, ln, t]) => {
          if (st < pos) return;
          hl += esc(x.s.slice(pos, st)) + (t === "ins" ? '<b class="ins" title="Bu yerda so\'z tushib qolgan">‸</b>' : "<u>" + esc(x.s.slice(st, st + ln)) + "</u>"); pos = st + ln;
        });
        hl += esc(x.s.slice(pos));
        let body = `<div class="orig">${hl}</div>`;
        if (ph === "new") body += `<textarea data-a="${i}" placeholder="To'g'ri gapni yozing…">${esc(ans.A[i] != null ? ans.A[i] : x.s)}</textarea>`;
        else {
          body += `<div class="lbl" style="font-size:.78rem;font-weight:700;color:var(--muted)">1-urinish</div><textarea readonly>${esc(v1)}</textarea>`;
          if (f1[i]) body += `<div class="verd ${f1[i].ok ? "ok" : "no"}">${f1[i].ok ? "✅ To'g'ri" : "❌ Hali to'g'ri emas"}${f1[i].iz ? " — " + esc(f1[i].iz) : ""}</div>`;
          else body += `<div class="verd wait">⏳ Tekshirilmoqda</div>`;
          if (f1[i] && !f1[i].ok) {
            if (ph === "retry") body += `<div class="lbl" style="font-size:.78rem;font-weight:700;color:var(--muted);margin-top:8px">2-urinish</div><textarea data-a="${i}" placeholder="Izohga qarab qayta yozing…">${esc(ans.A[i] != null ? ans.A[i] : v1)}</textarea>`;
            else if (v2 != null) {
              body += `<div class="lbl" style="font-size:.78rem;font-weight:700;color:var(--muted);margin-top:8px">2-urinish</div><textarea readonly>${esc(v2)}</textarea>`;
              body += f2[i] ? `<div class="verd ${f2[i].ok ? "ok" : "no"}">${f2[i].ok ? "✅ To'g'ri" : "❌ To'g'ri emas"}${f2[i].iz ? " — " + esc(f2[i].iz) : ""}</div>` : `<div class="verd wait">⏳ Tekshirilmoqda</div>`;
            }
          }
          if (ph === "done" && R.fixed && R.fixed[i]) body += `<div class="sample">💡 Namuna: ${esc(R.fixed[i])}</div>`;
        }
        out.push(`<div class="item"><div class="q"><span class="n">A${i + 1}.</span>Xato turi:<span class="tag">${esc(x.type)}</span></div>${body}</div>`);
      });
      out.push(`</div>`);
    }
    // B, C, D
    const secs = [["B", "🧠 B. Qoida bo'yicha yangi gaplar", "Avval qoidani o'qing, keyin to'g'ri variantni tanlang."], ["C", "🔤 C. O'zingiz adashgan so'zlar", "Bu so'z va birikmalarni essaylaringizda noto'g'ri yozgansiz. To'g'risini tanlang."], ["D", "📖 D. Reading: sinonimni toping", "Reading'da savoldagi so'z matnda boshqa so'z bilan beriladi. Qaysi variant shu so'zning ma'nosini beradi?"]];
    secs.forEach(([k, h, hint]) => {
      const L = M[k]; if (!L.length) return;
      let okN = 0; if (graded) okN = (R.g[k] || []).filter(Boolean).length;
      out.push(`<div class="sec"><h2>${h}<span class="cnt${graded && okN === L.length ? " ok" : ""}">${graded ? okN + " / " + L.length : L.length + " ta"}</span></h2><p class="hint">${hint}</p>`);
      if (k === "B") M.rules.forEach(r => out.push(`<div class="rule"><b>${esc(r.type)}:</b> ${esc(r.rule)}</div>`));
      L.forEach((x, i) => {
        const chosen = graded ? (R.a1[k] || [])[i] : ans[k][i], key = graded ? R.key[k][i] : null;
        const qq = k === "D" ? `Matnda: <b>${esc(x.q)}</b> = ?` : esc(x.q).replace("___", "<b>_____</b>");
        out.push(`<div class="item"><div class="q"><span class="n">${k}${i + 1}.</span>${qq}${x.type && k === "B" ? `<span class="tag">${esc(x.type)}</span>` : ""}</div>${optsHtml(k, i, x, chosen === "" ? null : chosen, key)}${graded && k === "C" && R.cIz && R.cIz[i] ? `<div class="iz">${esc(R.cIz[i])}</div>` : ""}</div>`);
      });
      out.push(`</div>`);
    });
    $("main").innerHTML = out.join("");
    const grow = t => { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; };
    $("main").querySelectorAll("textarea").forEach(grow);
    $("main").querySelectorAll("textarea[data-a]").forEach(t => t.oninput = () => { ans.A[+t.dataset.a] = t.value; grow(t); save(); });
    $("main").querySelectorAll(".opt:not(:disabled)").forEach(b => b.onclick = () => {
      const s = b.dataset.s, i = +b.dataset.i, j = +b.dataset.j; ans[s][i] = j;
      b.parentNode.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o === b)); save();
    });
    const open = (ph === "new" && !R.closed) || ph === "retry";
    $("foot").classList.toggle("hide", !open);
    $("btnGo").textContent = ph === "retry" ? "2-urinishni yuborish" : "Topshirish";
    $("score").className = "pill" + (ph === "done" ? " ok" : "");
    $("score").textContent = ph === "done" ? R.pct + "%" : graded ? "✅ " + R.g.ok + "/" + R.g.n : "—";
    if (ph === "new" && R.closed) $("main").insertAdjacentHTML("afterbegin", `<div class="banner re">⛔ Topshirish muddati (${esc(R.deadline)}) o'tib ketgan.</div>`);
    progress();
  }
  function submit() {
    if (busy) return;
    const M = R.me, ph = R.phase, miss = [];
    if (ph === "new") {
      M.A.forEach((x, i) => { const v = (ans.A[i] || "").trim(); if (!v || v === x.s) miss.push("A" + (i + 1)); });
      ["B", "C", "D"].forEach(k => M[k].forEach((_, i) => { if (ans[k][i] === "" || ans[k][i] == null) miss.push(k + (i + 1)); }));
    } else wrongIdx().forEach(i => { const v = (ans.A[i] || "").trim(); if (!v || v === ((R.a1.A || [])[i] || "")) miss.push("A" + (i + 1)); });
    const go = () => {
      busy = true; $("btnGo").disabled = true; $("btnGo").textContent = "Yuborilmoqda…";
      const body = { skill: "writing", mq: ph === "retry" ? 2 : 1, t: TID, k: KEY, A: M.A.map((x, i) => ans.A[i] != null ? ans.A[i] : (ph === "retry" ? (R.a1.A || [])[i] : x.s)), B: ans.B, C: ans.C, D: ans.D, minutes: Math.ceil(active / 60), pastes: pastes, leaves: leaves };
      post(body).then(r => {
        busy = false; $("btnGo").disabled = false;
        if (!r.ok) { modal("Yuborilmadi", esc(r.error || "Xato")); render(); return; }
        try { localStorage.removeItem(LS); } catch (e) {}
        load(r.g ? `B, C, D natijasi: <b>${r.g.ok} / ${r.g.n}</b>. To'g'ri javoblar endi ko'rinadi.<br>A bo'limni ustoz tekshiradi.` : "2-urinish yuborildi. Ustoz tekshiradi.");
      }).catch(() => { busy = false; $("btnGo").disabled = false; render(); modal("Internet xatosi", "Javoblaringiz saqlangan. Qayta urinib ko'ring."); });
    };
    modal(ph === "retry" ? "2-urinishni yuboramizmi?" : "Topshiramizmi?", (miss.length ? `⚠️ Javobsiz yoki o'zgartirilmagan: ${miss.join(", ")}.<br>` : "") + "Yuborgandan keyin o'zgartirib bo'lmaydi.", [["Ha, yuboraman", go], ["Davom etaman", null, true]]);
  }
  $("btnGo").onclick = submit;
  function load(msg) {
    api({ action: "hello", skill: "writing", k: KEY, t: TID }).then(r => {
      if (!r.ok) { $("who").textContent = "⛔ " + (r.error || "Xato"); $("main").innerHTML = `<div class="banner re">${esc(r.error || "Xato")}</div>`; return; }
      if (r.type !== "mashq") { location.replace("index.html" + location.search); return; }
      R = r; ans = { A: [], B: [], C: [], D: [] };
      const st = lsGet();
      if (st && st.phase === r.phase) { ans = Object.assign(ans, st.ans || {}); pastes = st.pastes || 0; leaves = st.leaves || 0; }
      document.title = r.title + " · Mening mashqim";
      render();
      if (msg) modal("Yuborildi ✅", msg);
    }).catch(() => { $("who").textContent = "⛔ Internet xatosi"; $("main").innerHTML = `<div class="banner re">Sahifani yangilang.</div>`; });
  }
  if (!KEY || !TID || !API) { $("who").textContent = "⛔ Havola noto'g'ri"; return; }
  load();
})();
</script>
</body>
</html>
